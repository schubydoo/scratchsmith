# Release automation for Scratchsmith — knope (CHANGESETS model).
#
# Model: every user-facing change ships a `.changeset/*.md` fragment. Those
# fragments (not commit messages) drive BOTH the version bump and the changelog.
# `knope document-change` scaffolds one; see CONTRIBUTING.md. Conventional-commit
# PR titles are still enforced (pr-title.yml) for a clean history, but ignored for
# release purposes.
#
# The two halves live in .github/workflows/knope-{prepare,release}.yml, behind the
# `KNOPE_ENABLED` repo variable. That variable is a live kill switch, not a pre-launch
# gate: releases are live and every tag shipped through this flow. Set it to anything
# but `true` to stop both halves, and the changeset check, without reverting anything.
# knope-prepare opens the version/changelog PR; knope-release BUILDS + cosign-signs
# the release tarballs and stages them into dist/release-assets/ BEFORE `knope
# release` runs. With `assets` set (below), that step creates the GitHub Release as
# a DRAFT, uploads every asset, then un-drafts (publishes) — the git tag is created
# only at publish, so the release locks IMMUTABLE with its assets already attached.
# The pushed tag then triggers release.yml (the signed multi-arch GHCR image).
#
# To pin a release to an exact version instead of the changeset-computed bump, dispatch
# prepare-release with override_version; see the override guard in knope-prepare.yml.

[package]
# Single crate. Anchored to line-start so it targets the [package] `version = "X.Y.Z"`
# and NOT the `{ version = "..." }` dependency pins. Verified by every release so far:
# only the package version line is rewritten.
versioned_files = [
  { path = "Cargo.toml", regex = '(?m)^version = "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"

# The signed release tarballs + checksums + SLSA provenance are built and staged
# into dist/release-assets/ by knope-release.yml BEFORE `knope release` runs. With
# `assets` set, the Release step creates the GitHub Release as a DRAFT, uploads
# every file under this glob, and only THEN publishes (creating the tag) — so the
# release is immutable WITH its assets. A fail-closed gate in knope-release.yml
# asserts the full signed set is present before knope runs, so a missing arch aborts
# before any publish instead of shipping a partial release. knope errors only on a
# globbed file that vanished, not on one that was never built — the gate is what
# guarantees completeness.
assets = "dist/release-assets/*"

# A fragment's `default:` value picks BOTH the changelog section and the version bump.
# A custom type bumps PATCH, measured with `knope prepare-release --dry-run`: a lone
# `default: deprecated` fragment took 1.4.0 to 1.4.1. COMPATIBILITY.md:38 makes a
# deprecation a MINOR, so a deprecation PR ships TWO fragments — one `minor` for the
# warning it adds, one `deprecated` for the Deprecated section. The minor carries the bump.
extra_changelog_sections = [
  { name = "Security", types = ["security"] },
  { name = "Performance", types = ["perf"] },
  { name = "Deprecated", types = ["deprecated"] },
]

[changes]
ignore_conventional_commits = true # fragments in .changeset/ are the sole source of truth

[github]
owner = "schubydoo"
repo = "scratchsmith"

[release_notes]
change_templates = [
  "### $summary ([#$pr_number](https://github.com/schubydoo/scratchsmith/pull/$pr_number))\n\n$details",
  "### $summary\n\n$details",
  "- $summary ([#$pr_number](https://github.com/schubydoo/scratchsmith/pull/$pr_number))",
  "- $summary",
]

# --- prepare-release: open/refresh the `release` PR (run on push to main) -----
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "cargo update --workspace" # resync Cargo.lock to the bumped version

[[workflows.steps]]
type = "Command"
command = 'git commit -am "chore: prepare release $version"'

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR tags and publishes **v$version**.\n\nGenerated by knope from the `.changeset/*.md` fragments; don't hand-edit.\n\n---\n\n$changelog"

# --- release: create the tag + GitHub Release on merge of the release PR ------
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

# --- document-change: scaffold a new .changeset fragment (local convenience) --
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
