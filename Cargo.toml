[package]
name = "scratchsmith"
version = "0.2.1"
edition = "2021"
rust-version = "1.96"
description = "Daemonless supply-chain packager for prebuilt dynamic Linux binaries"
license = "MIT"
repository = "https://github.com/schubydoo/scratchsmith"
readme = "README.md"
keywords = ["container", "oci", "docker", "elf", "supply-chain"]
categories = ["command-line-utilities"]
# Ship only what a `cargo install` needs — src is self-contained (no build.rs, no include_str!),
# so keep docs/, .github/, CLAUDE.md, Formula/, mkdocs.yml etc. out of the published crate.
include = ["src/**/*.rs", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
goblin = "0.10"
tempfile = "3"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.11"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
clap_complete = "4.6.9"
oci-client = "0.17.0"
docker_credential = "1.4.0"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "io-util"] }
# Identity-token exchange needs a direct HTTP client. Match oci-client's exact TLS feature
# (`reqwest/rustls` = aws-lc-rs + platform-verifier) so Cargo reuses the one compiled reqwest
# and no second TLS stack is linked — keeps the musl-static build working.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }

[dev-dependencies]
# Deterministic mock registry for the identity-token exchange test (no live network).
wiremock = "=0.6.5"

[profile.release]
# Ship a small single binary — the size claim is part of the pitch (TAD 8.1).
lto = true
strip = true
panic = "abort"
codegen-units = 1
