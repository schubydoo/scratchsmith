[package]
name = "scratchsmith"
version = "0.1.2"
edition = "2021"
rust-version = "1.96"
description = "Daemonless supply-chain packager for prebuilt dynamic Linux binaries"
license = "MIT"
repository = "https://github.com/schubydoo/scratchsmith"
readme = "README.md"
keywords = ["container", "oci", "docker", "elf", "supply-chain"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
goblin = "0.10"
tempfile = "3"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.11"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
clap_complete = "4.6.9"

[profile.release]
# Ship a small single binary — the size claim is part of the pitch (TAD 8.1).
lto = true
strip = true
panic = "abort"
codegen-units = 1
