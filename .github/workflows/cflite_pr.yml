# ClusterFuzzLite: fuzz the code each PR changes (cargo-fuzz harnesses in fuzz/). A short
# per-PR run on the address sanitizer. NOT a required check, so a flaky finding never blocks a
# merge, but a reproducible crash fails this run and, on a same-repo PR, is uploaded as a code-
# scanning alert (category clusterfuzzlite-pr, apart from the batch set). Deeper runs
# live in cflite_batch.yml. No corpus secret here (fork-PR-safe).
# Docs: https://google.github.io/clusterfuzzlite/
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions: {}

jobs:
  pr-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
      # As in cflite_batch.yml. A fork PR's token cannot write security events, so skip it.
      - name: Upload SARIF
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite-pr
