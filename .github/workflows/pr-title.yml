name: PR Title

# Validate the pull-request title follows Conventional Commits. The repo
# squash-merges, so the PR title becomes the squashed commit subject — a clean,
# conventional history. Keep `synchronize`: required checks are evaluated per
# head-SHA, so a fixup push needs a fresh check run.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# NO `concurrency` block, on purpose. Renokeeper edits the PR body seconds after
# it opens the PR, and a group would cancel the `opened` run. That leaves a
# `cancelled` check run on the head commit, which Renovate counts as pending
# forever, so its own automerge never fires. See changeset-check.yml.

jobs:
  validate:
    name: conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Mint a short-lived scratchsmith-ci App token (higher REST rate limit than
      # the github-actions[bot] pool). Same-repo PRs only (forks can't read App
      # secrets). Soft-fail: an empty token falls back to GITHUB_TOKEN.
      - name: Mint scratchsmith-ci App token
        id: app-token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SCRATCHSMITH_CI_CLIENT_ID }}
          private-key: ${{ secrets.SCRATCHSMITH_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: read
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            security
            revert
            docs
            chore
            ci
            build
            test
            refactor
            style
