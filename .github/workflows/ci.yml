name: CI

# fmt + clippy + rustdoc + typos, the test suite, an MSRV build, coverage with a
# line floor, and a supply-chain audit. A single aggregator job — `ci required
# checks passed` — is what branch protection requires; extend it via `needs`.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt · clippy · docs · typos
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~40s; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Spell-check all text (comments included); false positives go in _typos.toml.
      - name: Typos
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      # Keep the curl|bash installer clean. shellcheck ships on the runner, so no action.
      - name: ShellCheck (install.sh)
        run: shellcheck install.sh
      # A bare `eprintln!("skipping: …"); return;` makes nextest record the test as PASSED, so a
      # runner that lost a tool reports a green suite having run nothing. skip_required and
      # skip_optional in src/test_support.rs are the only two ways to skip, for unit and
      # integration tests alike. This keeps it that way: the existing sites were converted by
      # hand, and the next one would have to be too.
      - name: No hand-rolled test skips
        run: |
          set -euo pipefail
          hits=$(grep -rn 'eprintln!("skipping' src/ tests/ --include='*.rs' \
            | grep -v '^src/test_support\.rs:' || true)
          if [ -n "$hits" ]; then
            echo "::error::Use skip_required or skip_optional from src/test_support.rs, not a bare eprintln."
            echo "$hits"
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: rustfmt, clippy
          rustflags: ""
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The only step that fires rustdoc:: lints (broken intra-doc links, bad code
      # blocks). --document-private-items because this is a binary crate.
      - name: Docs (deny warnings)
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Prove the crate still builds on its declared MSRV, not just latest stable.
    # scratchsmith pins MSRV 1.96 (unlike the sibling repos, which track stable).
    name: build (MSRV 1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~30s; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is SHA-pinned to a setup-rust-toolchain release (the `# v2.0.0`
      # comment is the pinned tag). The Rust TOOLCHAIN is pinned at the declared MSRV
      # via the `toolchain:` input (Cargo.toml rust-version = 1.96); Renovate is told
      # not to bump it by the schubydoo/renovate-config preset (`rust` dep off for
      # this file). rustflags: "" and build-warnings: warn keep the action from
      # forcing a blanket warning-deny (RUSTFLAGS in v1, CARGO_BUILD_WARNINGS=deny by
      # default in v2) on the MSRV build — a future deprecation warning must not fail
      # it; warnings are denied surgically elsewhere.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.96.0
          rustflags: ""
          build-warnings: warn
      - run: cargo build --all-features

  test:
    # Linux-only: scratchsmith packs Linux ELF binaries and its integration tests
    # need ldconfig / the ELF loader / Docker, which don't exist on macOS/Windows.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15 # about 3x the slowest of 12 green runs (~4.5 min)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          rustflags: ""
      # nextest instead of `cargo test`: same gate, plus a junit.xml (the ci
      # profile in .config/nextest.toml) — the only format Codecov Test Analytics
      # ingests. Prebuilt binary via install-action.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      # upx isn't preinstalled; the --upx pack tests skip without it.
      # ⚠️ Required by tests/common::skip_required — dropping this step FAILS the upx tests
      # under CI rather than skipping them. That is the point: a skip reads as a pass.
      - name: Install upx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends upx-ucl
      # syft isn't preinstalled. The `--packages sbom` test compares two real SBOMs, and
      # nothing else exercises the guard that takes the package records out of the image.
      # ⚠️ Required by tests/common::skip_required, like upx above.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # tests/differential.rs runs each packed rootfs with `unshare -r chroot`, and Ubuntu's
      # AppArmor can restrict unprivileged user namespaces.
      # ⚠️ Required by tests/common::skip_required, like upx above.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test (nextest → JUnit)
        run: cargo nextest run --all-features --profile ci
      # nextest does not run doctests; run them separately (reuses the build cache).
      - name: Doctests
        run: cargo test --all-features --doc
      # Non-blocking, tokenless (public repo); uploads even on failure (nextest
      # writes junit.xml before exiting non-zero), which is when analytics matter.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/nextest/ci/junit.xml
          disable_search: true
          report_type: test_results
          fail_ci_if_error: false

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20 # about 3x the slowest of 12 green runs (~6 min)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: llvm-tools-preview
          rustflags: ""
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      # Enforce the line floor (baseline ~94.5%) and emit lcov. cargo-llvm-cov
      # writes lcov.info before the threshold check, so the upload still runs on a
      # floor failure.
      # upx isn't preinstalled; without it the --upx pack tests skip and their lines look uncovered.
      # tini is here only, so the --init path is covered and the test job still runs the
      # tini-absent refusal.
      # ⚠️ Required by tests/common::skip_required — see the note on the test job's copy.
      - name: Install upx and tini
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends upx-ucl tini
      # ⚠️ Required by tests/common::skip_required — see the note on the test job's copy.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # ⚠️ Required by tests/common::skip_required — see the note on the test job's copy.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Coverage (lcov + line floor)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 90
      - name: Upload to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  supply-chain:
    name: audit · deny
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~25s; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit
        run: cargo audit
      # fuzz/ is a DETACHED workspace (empty [workspace] in fuzz/Cargo.toml), so it resolves
      # its own graph and bare `cargo audit` above never reads fuzz/Cargo.lock. That blind spot
      # left RUSTSEC-2026-0285 (rustls 0.23.44) sitting in fuzz/Cargo.lock after the main lock
      # was patched, visible only as a weekly Scorecard alert. Renovate's Monday lockFileMaintenance
      # does cover this file, but a required check must not wait a week for it.
      - name: Audit fuzz lockfile
        run: cargo audit --file fuzz/Cargo.lock
      - name: Deny
        run: cargo deny check

  completions:
    # Generate the shell completion scripts and prove each one sources cleanly
    # under its own shell. bash ships on the runner; install zsh/fish.
    name: shell completions
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~1 min; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          rustflags: ""
      - name: Install zsh and fish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
      # Debug build: completion output is byte-identical to release, and this
      # job is on the required-checks critical path — reuse the warm rust-cache
      # instead of the slow LTO release profile.
      - run: cargo build
      - name: Generate and source completions
        run: |
          set -euo pipefail
          bin=target/debug/scratchsmith
          "$bin" --completions bash > ss.bash
          "$bin" --completions zsh  > _scratchsmith
          "$bin" --completions fish > ss.fish
          # Each shell gets its OWN statement, never `cmd && echo "... OK"`. POSIX `set -e` is
          # ignored for every command of an AND-OR list except the last, so under the `&&` form
          # a broken bash or zsh completion left this REQUIRED job green. Only the fish line was
          # gated, and only because it happened to be last.
          bash --noprofile --norc -c 'source ss.bash'
          echo "bash: sourced OK"
          # Set fpath BEFORE compinit (it reads fpath when it runs).
          zsh -c 'fpath=($PWD $fpath); autoload -Uz compinit; compinit -u; source ./_scratchsmith'
          echo "zsh: sourced OK"
          fish -c 'source ss.fish'
          echo "fish: sourced OK"

  musl:
    # Gate the shipped artifact's invariant on EVERY PR, not just at release: the
    # binary must link fully static against musl. The release builds it via zig, but
    # nothing else did — so a dependency bump that pulls OpenSSL/native-tls (breaking
    # the static link) used to pass PR CI and only fail at release. TLS must stay on
    # rustls + aws-lc-rs. amd64 is enough to catch a link/TLS regression (same crates
    # + features as arm64); the release still builds both arches.
    name: build (static musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~1 min; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          rustflags: ""
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # renovate: datasource=github-releases depName=ziglang/zig
          version: 0.15.1
          use-cache: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-zigbuild@0.24.0
      # Debug build: the point is the link, not optimization — reuse the warm cache
      # instead of the slow LTO release profile (this is on the required-checks path).
      - name: Build (static musl via zig)
        run: cargo zigbuild --target x86_64-unknown-linux-musl --bin scratchsmith
      - name: Assert the binary is fully static
        run: |
          bin=target/x86_64-unknown-linux-musl/debug/scratchsmith
          file "$bin"
          # Key on the invariant itself, not file(1)'s wording: a static binary has no
          # PT_INTERP (no dynamic loader). This holds for both classic ET_EXEC static and
          # static-PIE, which `file` prints as "static-pie linked" — a substring match on
          # "statically linked" would false-fail there.
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::musl build has a PT_INTERP segment (a dynamic loader) — not statically linked. A dependency likely pulled a dynamic TLS/crypto backend; keep TLS on rustls + aws-lc-rs."
            exit 1
          fi

  fuzz-check:
    # The fuzz harness lives in a detached workspace (fuzz/), so lint/msrv/test above never
    # compile it — a refactor of a fuzzed entry point (parse_elf_info, hardening_from_bytes,
    # resolve_with) can break a target and otherwise only surface in a NON-required
    # ClusterFuzzLite run. `cargo check` type-checks the harness so that drift fails a required
    # check. Stable is enough: cargo-fuzz needs nightly to BUILD (sanitizer flags), not to check.
    name: fuzz harness check
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~35s; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: rustfmt
          cache-workspaces: fuzz
          rustflags: ""
      # -D warnings holds the harness to the main crate's clippy bar: catches warning-only drift
      # (unused import, a newly-#[deprecated] call) that a bare `check` exits 0 on. Deps are
      # --cap-lints'd by cargo, so only scratchsmith + the harness are held to it.
      # CFLAGS mirrors the optimization level the ClusterFuzzLite image forces on C deps: a
      # build script that only works at the default flags (aws-lc-sys's jitterentropy, broken
      # by a cc bump) otherwise fails first in the NON-required fuzzing run.
      - run: cargo check --manifest-path fuzz/Cargo.toml
        env:
          RUSTFLAGS: "-D warnings"
          CFLAGS: "-O1"
      # fuzz-seconds in cflite_batch.yml is the budget for the WHOLE batch run, split across the
      # targets, so a new target quietly shortens every target's share. Keep 300 s each.
      - name: Fuzz budget covers every target
        run: |
          set -euo pipefail
          targets=$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' | wc -l)
          budget=$(sed -nE 's/^ *fuzz-seconds: *([0-9]+).*/\1/p' .github/workflows/cflite_batch.yml)
          share=$((budget / targets))
          if [ "$share" -lt 300 ]; then
            echo "::error::cflite_batch.yml fuzz-seconds ($budget) gives each of $targets targets ${share} s; set it to $((targets * 300))."
            exit 1
          fi
          echo "fuzz budget: $budget s over $targets targets = $share s each"
      # After the type-check, so an API break in a target is reported before a format drift.
      # The main `Format` step reads the root workspace only, and fuzz/ is detached, so its
      # targets drifted from rustfmt unseen.
      - name: Format (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

  semver:
    # INFORMATIONAL ONLY — deliberately NOT in ci-required-checks below, so it never
    # blocks merge. The Rust LIBRARY API is explicitly out of contract (COMPATIBILITY.md):
    # the crate is `pub` for its own tests, not as a supported API. This surfaces a
    # SemVer-incompatible change to that pub API against the last crates.io release as a
    # heads-up. Green = additive change; red = a breaking pub-API change to acknowledge
    # (usually fine for a binary crate — the CLI/config/JSON surfaces are the real contract,
    # and those are gated by tests). cargo-semver-checks needs nightly rustdoc JSON, which
    # the action installs and manages.
    name: semver-checks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # slowest of 12 green runs ~75s; 10-minute floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  real-tools:
    # Pack three real third-party tools with this PR's build and run each image once with a
    # short piece of real work. The fixtures in tests/ are binaries we build ourselves; these
    # are upstream release builds, and duckdb is C++, so it also needs libstdc++ staged. The
    # nightly full list belongs to schubydoo/scratchsmith-images, not here.
    # Each tool comes from its PyPI wheel (the projects publish their Linux binaries there),
    # pinned by version and sha256. Bump a pin by hand: a version bump also needs the new
    # wheel's URL and hash from PyPI.
    name: pack real tools
    runs-on: ubuntu-latest
    timeout-minutes: 10 # new job; a local run of the three packs takes well under a minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          rustflags: ""
      - name: Build scratchsmith
        run: cargo build --bin scratchsmith
      - name: Download the pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whl" "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/whl"
          # tool, path of the binary inside the wheel, sha256, wheel URL
          while read -r tool member sha url; do
            whl="${url##*/}"
            curl -fsSL --retry 3 -o "$whl" "$url"
            echo "$sha  $whl" | sha256sum -c -
            python3 -I -m zipfile -e "$whl" "x-$tool"
            install -m 0755 "x-$tool/$member" "$RUNNER_TEMP/tools/$tool"
          done <<'EOF'
          ruff ruff-0.17.6.data/scripts/ruff aa3b08254a732acba246891089a152c47c5733dc36b8ecb76ce8602f8326e5e4 https://files.pythonhosted.org/packages/be/48/3df7d81249fd69ee6a49519b149fb5d11e13118fd7d0e8d65329a237087b/ruff-0.17.6-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          uv uv-0.13.10.data/scripts/uv 7cc9c41b43d583e34c781fd3446405b06e9c5fa2db468ce2a534d353db6429e5 https://files.pythonhosted.org/packages/8b/99/fad906311e48fce22e4db71ee4c3df29bdb17b29eb36878f52b8dcd79237/uv-0.13.10-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          duckdb duckdb_cli/duckdb 44131cf22c717febcb9bb9f1ae117690f1e2ff6947a3154150ddf2ad40d8b31b https://files.pythonhosted.org/packages/6a/a4/402c39041ccd4a0f6fac4e63ae42215a42d11336bace1278c48541febdf8/duckdb_cli-2.0.1-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          EOF
      - name: Pack each tool
        run: |
          set -euo pipefail
          for tool in ruff uv duckdb; do
            target/debug/scratchsmith pack "$RUNNER_TEMP/tools/$tool"
          done
      # Each check does real work, not just --version, and fails on a wrong answer.
      - name: "ruff: lint a file"
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ruff" && printf 'import os\n' > "$RUNNER_TEMP/ruff/a.py"
          out=$(docker run --rm -v "$RUNNER_TEMP/ruff:/work:ro" scratchsmith/ruff:packed \
            check --no-cache --select F401 /work/a.py)
          rc=$?
          echo "$out"
          # ruff exits 1 when it finds a problem, and this file has exactly one.
          [ "$rc" -eq 1 ] && grep -q 'F401' <<<"$out"
      - name: "uv: bump a project's version"
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/uv"
          mkdir -p "$proj"
          printf '[project]\nname = "demo"\nversion = "0.1.0"\nrequires-python = ">=3.9"\ndependencies = []\n' \
            > "$proj/pyproject.toml"
          # The image runs as its non-root user, so let it rewrite the mounted project.
          chmod 0777 "$proj" && chmod 0666 "$proj/pyproject.toml"
          docker run --rm -v "$proj:/p" scratchsmith/uv:packed \
            --no-cache --offline version --bump minor --frozen --project /p
          grep -qx 'version = "0.2.0"' "$proj/pyproject.toml"
      - name: "duckdb: run a query"
        run: |
          set -euo pipefail
          out=$(docker run --rm scratchsmith/duckdb:packed -csv -noheader \
            -c "select sum(range) from range(1000000)")
          echo "$out"
          [ "$out" = "499999500000" ]

  ci-required-checks:
    # The single status branch protection requires. Add new required jobs to needs.
    # `semver` is intentionally excluded — it is informational (see its comment above).
    name: ci required checks passed
    if: always()
    needs: [lint, msrv, test, coverage, supply-chain, completions, musl, fuzz-check, real-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 10 # only checks the needs results; 10-minute floor, as for the other jobs
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed."
