name: CI

# fmt + clippy + rustdoc + typos, the test suite, an MSRV build, coverage with a
# line floor, and a supply-chain audit. A single aggregator job — `ci required
# checks passed` — is what branch protection requires; extend it via `needs`.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt · clippy · docs · typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Spell-check all text (comments included); false positives go in _typos.toml.
      - name: Typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
      # Keep the curl|bash installer clean. shellcheck ships on the runner, so no action.
      - name: ShellCheck (install.sh)
        run: shellcheck install.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The only step that fires rustdoc:: lints (broken intra-doc links, bad code
      # blocks). --document-private-items because this is a binary crate.
      - name: Docs (deny warnings)
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Prove the crate still builds on its declared MSRV, not just latest stable.
    # scratchsmith pins MSRV 1.96 (unlike the sibling repos, which track stable).
    name: build (MSRV 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action ref is `# stable` like every other job (same pinned SHA); the
      # Rust TOOLCHAIN is pinned at the declared MSRV via the `toolchain:` input
      # below (Cargo.toml rust-version = 1.96). Renovate is told not to bump that
      # toolchain by the schubydoo/renovate-config preset (`rust` dep off for this
      # file). The comment must match the SHA, not the toolchain — a `# 1.96.0`
      # label here points at the stable-branch commit, not the 1.96.0 tag
      # (zizmor ref-version-mismatch).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --all-features

  test:
    # Linux-only: scratchsmith packs Linux ELF binaries and its integration tests
    # need ldconfig / the ELF loader / Docker, which don't exist on macOS/Windows.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # nextest instead of `cargo test`: same gate, plus a junit.xml (the ci
      # profile in .config/nextest.toml) — the only format Codecov Test Analytics
      # ingests. Prebuilt binary via install-action.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest
      # upx isn't preinstalled; the --upx pack tests skip without it (Task 5.3).
      - name: Install upx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends upx-ucl
      - name: Test (nextest → JUnit)
        run: cargo nextest run --all-features --profile ci
      # nextest does not run doctests; run them separately (reuses the build cache).
      - name: Doctests
        run: cargo test --all-features --doc
      # Non-blocking, tokenless (public repo); uploads even on failure (nextest
      # writes junit.xml before exiting non-zero), which is when analytics matter.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: target/nextest/ci/junit.xml
          disable_search: true
          report_type: test_results
          fail_ci_if_error: false

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-llvm-cov
      # Enforce the line floor (baseline ~94.5%) and emit lcov. cargo-llvm-cov
      # writes lcov.info before the threshold check, so the upload still runs on a
      # floor failure.
      # upx isn't preinstalled; without it the --upx pack tests skip and their lines look uncovered.
      - name: Install upx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends upx-ucl
      - name: Coverage (lcov + line floor)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 90
      - name: Upload to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  supply-chain:
    name: audit · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check

  completions:
    # Generate the shell completion scripts and prove each one sources cleanly
    # under its own shell (Task 3.6 AC). bash ships on the runner; install zsh/fish.
    name: shell completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install zsh and fish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
      # Debug build: completion output is byte-identical to release, and this
      # job is on the required-checks critical path — reuse the warm rust-cache
      # instead of the slow LTO release profile.
      - run: cargo build
      - name: Generate and source completions
        run: |
          bin=target/debug/scratchsmith
          "$bin" --completions bash > ss.bash
          "$bin" --completions zsh  > _scratchsmith
          "$bin" --completions fish > ss.fish
          bash --noprofile --norc -c 'source ss.bash' && echo "bash: sourced OK"
          # Set fpath BEFORE compinit (it reads fpath when it runs).
          zsh -c 'fpath=($PWD $fpath); autoload -Uz compinit; compinit -u; source ./_scratchsmith' && echo "zsh: sourced OK"
          fish -c 'source ss.fish' && echo "fish: sourced OK"

  musl:
    # Gate the shipped artifact's invariant on EVERY PR, not just at release: the
    # binary must link fully static against musl. The release builds it via zig, but
    # nothing else did — so a dependency bump that pulls OpenSSL/native-tls (breaking
    # the static link) used to pass PR CI and only fail at release. TLS must stay on
    # rustls + aws-lc-rs. amd64 is enough to catch a link/TLS regression (same crates
    # + features as arm64); the release still builds both arches.
    name: build (static musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-zigbuild@0.23.0
      # Debug build: the point is the link, not optimization — reuse the warm cache
      # instead of the slow LTO release profile (this is on the required-checks path).
      - name: Build (static musl via zig)
        run: cargo zigbuild --target x86_64-unknown-linux-musl --bin scratchsmith
      - name: Assert the binary is fully static
        run: |
          bin=target/x86_64-unknown-linux-musl/debug/scratchsmith
          file "$bin"
          # Key on the invariant itself, not file(1)'s wording: a static binary has no
          # PT_INTERP (no dynamic loader). This holds for both classic ET_EXEC static and
          # static-PIE, which `file` prints as "static-pie linked" — a substring match on
          # "statically linked" would false-fail there.
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::musl build has a PT_INTERP segment (a dynamic loader) — not statically linked. A dependency likely pulled a dynamic TLS/crypto backend; keep TLS on rustls + aws-lc-rs."
            exit 1
          fi

  fuzz-check:
    # The fuzz harness lives in a detached workspace (fuzz/), so lint/msrv/test above never
    # compile it — a refactor of a fuzzed entry point (parse_elf_info, hardening_from_bytes,
    # resolve_with) can break a target and otherwise only surface in a NON-required
    # ClusterFuzzLite run. `cargo check` type-checks the harness so that drift fails a required
    # check. Stable is enough: cargo-fuzz needs nightly to BUILD (sanitizer flags), not to check.
    name: fuzz harness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # -D warnings holds the harness to the main crate's clippy bar: catches warning-only drift
      # (unused import, a newly-#[deprecated] call) that a bare `check` exits 0 on. Deps are
      # --cap-lints'd by cargo, so only scratchsmith + the harness are held to it.
      - run: cargo check --manifest-path fuzz/Cargo.toml
        env:
          RUSTFLAGS: "-D warnings"

  semver:
    # INFORMATIONAL ONLY — deliberately NOT in ci-required-checks below, so it never
    # blocks merge. The Rust LIBRARY API is explicitly out of contract (COMPATIBILITY.md):
    # the crate is `pub` for its own tests, not as a supported API. This surfaces a
    # SemVer-incompatible change to that pub API against the last crates.io release as a
    # heads-up. Green = additive change; red = a breaking pub-API change to acknowledge
    # (usually fine for a binary crate — the CLI/config/JSON surfaces are the real contract,
    # and those are gated by tests). cargo-semver-checks needs nightly rustdoc JSON, which
    # the action installs and manages.
    name: semver-checks (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  ci-required-checks:
    # The single status branch protection requires. Add new required jobs to needs.
    # `semver` is intentionally excluded — it is informational (see its comment above).
    name: ci required checks passed
    if: always()
    needs: [lint, msrv, test, coverage, supply-chain, completions, musl, fuzz-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed."
