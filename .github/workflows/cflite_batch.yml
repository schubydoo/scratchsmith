# ClusterFuzzLite: scheduled BATCH fuzzing (the deep counterpart to cflite_pr). Runs EVERY
# harness in fuzz/ on a schedule (mode: batch), so unchanged code is re-fuzzed and each target
# gets a longer run. A reproducible crash fails this run and is uploaded as a code-scanning
# alert (category clusterfuzzlite). NOT a required check.
#
# Corpus persistence: clones the private storage-repo, fuzzes, and pushes the grown corpus back
# so coverage compounds across runs. Needs schubydoo/scratchsmith-fuzz-corpus and a
# FUZZ_STORAGE_TOKEN PAT (write). If the secret is unset the job still runs (fuzzes from seed);
# it just does not accumulate. fuzz-seconds is the budget for the WHOLE run, split evenly across
# the targets: 2400 over 8 targets is 300 s each. ci.yml's `fuzz harness check` fails when the
# share drops under 300 s, so a PR that adds a target also raises this.
# Docs: https://google.github.io/clusterfuzzlite/
name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "37 4 */2 * *" # every other calendar day, 04:37 UTC
  workflow_dispatch:

permissions: {}

jobs:
  batch-fuzzing:
    name: batch fuzzing
    runs-on: ubuntu-latest
    # 40 min of fuzzing, plus the build, the corpus pull and push, and the SARIF upload.
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 2400
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/scratchsmith-fuzz-corpus.git
          storage-repo-branch: main
      # Not always(): a crash fails the step above, and that run's SARIF matters most, but a
      # cancelled run (the timeout, or a newer run) could upload an empty set and close alerts.
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite
