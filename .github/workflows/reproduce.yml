name: Reproduce release

# Rebuild each release binary from its tag and compare it byte for byte with the binary in
# the published tarball. The build recipe is the tag's own .github/actions/release-build
# (pinned Rust, zig, cargo-zigbuild and scripts/build-release-binary.sh), the one that
# knope-release.yml used for the release. REPRODUCE.md has the same steps for a third party.
#
# - push of a `v*` tag: knope creates the tag when it publishes the release, so the tarballs
#   are already attached. A red run means that release is not reproducible.
# - workflow_dispatch: re-check an existing release. Dispatch it FROM THE TAG (the "Use
#   workflow from" picker lists tags), like release.yml, so `$/` loads that tag's recipe.
#   Tags from before this workflow existed don't have it, so they can't be dispatched.
# - pull_request that touches the recipe: build twice, from two directories with two
#   CARGO_HOMEs, and compare. That proves the recipe gives the same bytes on another machine
#   layout before a release depends on it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actions/release-build/**
      - .github/workflows/reproduce.yml
      - scripts/build-release-binary.sh

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    name: Reproduce ${{ matrix.name }} binary
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a release build takes ~2 min; the PR check builds twice
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-amd64
          - target: aarch64-unknown-linux-musl
            name: linux-arm64
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
    steps:
      # Dispatched from a branch, there is no release to compare with. Fail loud rather than
      # look green while checking nothing.
      - name: Require a release tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Dispatch Reproduce release FROM A RELEASE TAG (vX.Y.Z); got ${GITHUB_REF_TYPE} '${TAG}'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild from the tag
        id: build
        uses: $/.github/actions/release-build
        with:
          target: ${{ matrix.target }}

      - name: Compare with the published binary
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILT: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          pkg="scratchsmith-${TAG}-${NAME}"
          dl="$RUNNER_TEMP/published"
          mkdir -p "$dl"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dl" \
            --pattern "${pkg}.tar.gz" --pattern checksums.txt
          # The tarball must be the one checksums.txt (signed at release) lists.
          (cd "$dl" && sha256sum -c --ignore-missing --strict checksums.txt)
          tar -C "$dl" -xzf "$dl/${pkg}.tar.gz" "${pkg}/scratchsmith"
          published="$dl/${pkg}/scratchsmith"
          sha256sum "$published" "$REBUILT"
          if ! cmp "$published" "$REBUILT"; then
            echo "::error::${TAG} ${NAME}: the rebuilt binary differs from the published one"
            exit 1
          fi
          echo "::notice::${TAG} ${NAME}: the rebuilt binary matches the published one byte for byte"

      - name: Rebuild from another directory and CARGO_HOME, and compare
        if: github.event_name == 'pull_request'
        env:
          FIRST: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          # setup-rust-toolchain pins the toolchain only for this directory, so carry the pin.
          toolchain="$(rustup show active-toolchain | cut -d' ' -f1)"
          other="$RUNNER_TEMP/elsewhere/scratchsmith"
          mkdir -p "$other"
          git archive HEAD | tar -x -C "$other"
          (cd "$other" && RUSTUP_TOOLCHAIN="$toolchain" CARGO_HOME="$RUNNER_TEMP/other-cargo-home" \
            scripts/build-release-binary.sh "$TARGET")
          second="$other/target/${TARGET}/release/scratchsmith"
          sha256sum "$FIRST" "$second"
          if ! cmp "$FIRST" "$second"; then
            echo "::error::${NAME}: two builds of the same source differ"
            exit 1
          fi
          echo "::notice::${NAME}: two builds from different directories match byte for byte"
