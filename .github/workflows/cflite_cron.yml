# ClusterFuzzLite: the weekly corpus PRUNE + COVERAGE report (maintenance for cflite_batch).
# Prune minimizes the persisted corpus (drops inputs that add no coverage). Coverage replays the
# whole corpus and pushes an HTML line-coverage report to the corpus repo's gh-pages branch,
# showing which parser code the fuzzers reach. Both reuse the storage-repo + FUZZ_STORAGE_TOKEN.
# NOT required checks. Docs: https://google.github.io/clusterfuzzlite/
name: ClusterFuzzLite cron (prune + coverage)

on:
  schedule:
    - cron: "43 5 * * 0" # Sunday 05:43 UTC
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    name: prune corpus
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-prune
      cancel-in-progress: true
    steps:
      - name: Build fuzzers (address)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Prune the persisted corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: prune
          sanitizer: address
          output-sarif: true
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/scratchsmith-fuzz-corpus.git
          storage-repo-branch: main

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-coverage
      cancel-in-progress: true
    steps:
      - name: Build fuzzers (coverage)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: coverage
      - name: Generate the coverage report
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        env:
          # Scope the HTML report to our own source. The OSS-Fuzz coverage script appends
          # COVERAGE_EXTRA_ARGS as the last llvm-cov argument, and -ignore-filename-regex is
          # additive, so this drops the linked crates (/rust/), the C deps (/aws-lc/,
          # /generated-include/), the toolchain (/rustc/), the libFuzzer runtime, and our own
          # fuzz harness (/fuzz/), leaving only /src/scratchsmith/src/*.rs. llvm-cov uses
          # LLVM regex (no lookahead), so the non-source paths are enumerated, not negated.
          # Confirmed only by a workflow_dispatch run: the report is not built on a PR.
          COVERAGE_EXTRA_ARGS: "-ignore-filename-regex=(^/rust/|^/rustc/|^/aws-lc/|^/generated-include/|/fuzz/|src/libfuzzer/)"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: coverage
          sanitizer: coverage
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/scratchsmith-fuzz-corpus.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
      # Publish the report as a downloadable run artifact. GitHub Pages needs a public repo or
      # a paid plan; the corpus repo is private, so a maintainer cannot browse gh-pages. The
      # coverage step pushes the self-contained HTML tree to gh-pages/coverage/latest/report,
      # so clone just that path (sparse, no corpus blobs) and upload it. Download the artifact,
      # unzip, and open index.html locally with every linked sub-page present.
      - name: Collect the coverage report from gh-pages
        shell: bash
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages --filter=blob:none --sparse \
            "https://${FUZZ_STORAGE_TOKEN}@github.com/schubydoo/scratchsmith-fuzz-corpus.git" "$work"
          git -C "$work" sparse-checkout set coverage/latest/report
          rm -rf coverage-report
          cp -r "$work/coverage/latest/report" coverage-report
      - name: Upload the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-coverage-report
          path: coverage-report
          if-no-files-found: error
