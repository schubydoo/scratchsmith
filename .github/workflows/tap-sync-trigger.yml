name: Homebrew tap sync trigger

# When a packaging-bump PR merges (Formula/scratchsmith.rb on main just changed),
# trigger the tap's formula sync IMMEDIATELY instead of waiting for its daily cron.
# Best-effort: a dispatch failure just leaves the cron as the safety net, so this never
# blocks or fails the release path.
#
# WHY this trigger point (not `release: published`): at publish time the bumped formula
# is NOT yet on main — packaging-bump opens a PR; it doesn't push main. So we fire on the
# packaging-bump PR MERGE, detected by the head-branch prefix.
#
# SECURITY:
#   * Same-repo, merged `packaging-bump/*` PR only. The same-repo gate means a fork can't
#     reach this even by naming its head `packaging-bump/*`; `pull_request` (not _target).
#   * Mints a TAP-SCOPED scratchsmith-ci App token — owner schubydoo, repositories
#     homebrew-scratchsmith, `actions:write` ONLY (never contents:write) — the minimal
#     cross-repo surface, exactly what `gh workflow run` (workflow_dispatch) needs. The
#     empty-token guard fails loud (the App must be installed on the tap with
#     Actions: write). Workflow-level permissions stay read-only.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  trigger-tap-sync:
    name: dispatch the tap formula sync
    timeout-minutes: 5
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'packaging-bump/')
    runs-on: ubuntu-latest
    steps:
      - name: Mint a tap-scoped scratchsmith-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SCRATCHSMITH_CI_CLIENT_ID }}
          private-key: ${{ secrets.SCRATCHSMITH_CI_APP_PRIVATE_KEY }}
          owner: schubydoo
          repositories: homebrew-scratchsmith
          permission-actions: write # only what `gh workflow run` (workflow_dispatch) needs
      - name: Verify the tap token was minted
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::scratchsmith-ci App token for the tap was empty; refusing to dispatch. Confirm the App is installed on schubydoo/homebrew-scratchsmith with Actions: write."
          exit 1
      # Best-effort: the daily cron in the tap's sync-formula.yml is the fallback, so a
      # dispatch failure must NOT fail this job (and never the release path).
      - name: Trigger the tap formula sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run sync-formula.yml --repo schubydoo/homebrew-scratchsmith --ref main \
            || echo "::warning::tap sync dispatch failed; the daily cron will still sync the formula."
