name: Knope Release

# knope's "publish" half. When the `chore: prepare release X.Y.Z` PR (opened by
# knope-prepare.yml from the `release` branch) merges, this workflow BUILDS the
# static-musl release binaries (amd64 + arm64), generates a CycloneDX SBOM of the
# crate's own dependency graph (syft over Cargo.lock), keyless-signs the checksums
# with cosign, generates a SLSA build-provenance attestation, and stages the whole
# signed set into dist/release-assets/. Only THEN does `knope release` run: with
# `assets` configured in knope.toml it creates the GitHub Release as a DRAFT,
# uploads every asset, and un-drafts (publishes) — the git tag is created at
# publish, so the release locks IMMUTABLE with its assets already attached (this is
# what makes GitHub's immutable-releases setting safe to enable).
#
# The tag is pushed as the scratchsmith-ci App (not GITHUB_TOKEN), so it triggers
# release.yml — the signed multi-arch FROM scratch GHCR image, which sources these
# just-published tarballs. This workflow deliberately does NOT build the image.
#
# GATED behind the `KNOPE_ENABLED` repo variable. Triggers on the MERGE of the
# release PR (head branch `release`), tagging the squash commit that landed on main.
#
# FAIL CLOSED: the staging gate aborts BEFORE `knope release` if any tarball,
# signature, or the provenance bundle is missing — no tag, no image, nothing
# published. A half-built release never reaches the publish step.
#
# Verifying a published release asset:
#   gh attestation verify <tarball> --repo schubydoo/scratchsmith   # SLSA provenance (primary)
#   sha256sum -c checksums.txt                                       # tarball + SBOM hashes
# The CycloneDX SBOM (scratchsmith-vX.Y.Z.cdx.json) is listed in checksums.txt, so
# the cosign signature + SLSA provenance over checksums.txt cover it transitively.
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/schubydoo/scratchsmith/\.github/workflows/knope-release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: # manual fallback; run from main once Cargo.toml holds the version

permissions:
  contents: read

concurrency:
  group: knope-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the two static-musl release binaries on the release commit. No signing
  # identity here (contents: read only) — the binaries cross as artifacts and are
  # signed in the `release` job, mirroring release.yml's build/sign split.
  binaries:
    name: Build ${{ matrix.name }} binary
    if: >-
      ${{ vars.KNOPE_ENABLED == 'true'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.merged == true
               && github.head_ref == 'release')
              || (github.event_name == 'workflow_dispatch'
                  && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # One target's failure must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-amd64
          - target: aarch64-unknown-linux-musl
            name: linux-arm64
    steps:
      # The squash commit that landed on main carries the bumped Cargo.toml, so its
      # `version` names the tarballs (not github.ref_name, which is `main`/the PR
      # merge ref here, never the tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      # zig is the cross linker for both musl targets.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false
      # Pinned prebuilt (not `cargo install`): cargo-zigbuild tracks zig's breaking
      # CLI, so a skew would only surface at release time. Renovate bumps the pin.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-zigbuild@0.23.0
      - name: Build (static musl via zig)
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin scratchsmith
      - name: Package tarball
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Version from the bumped [package] line (line-anchored, so a dependency
          # `version = "..."` pin can't shadow it); names the tarball to match the
          # tag knope will create (v${VERSION}).
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::could not parse package version from Cargo.toml (got '${version}')"; exit 1 ;;
          esac
          pkg="scratchsmith-v${version}-${NAME}"
          mkdir -p "dist/${pkg}"
          cp "target/${TARGET}/release/scratchsmith" "dist/${pkg}/scratchsmith"
          cp LICENSE README.md "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: dist/scratchsmith-*-${{ matrix.name }}.tar.gz
          # Fail loudly on a name mismatch rather than staging a subset of arches.
          if-no-files-found: error
          retention-days: 1

  # Sign + provenance + stage every asset, fail-closed, then publish via knope.
  release:
    name: Sign + provenance + publish
    needs: binaries
    if: ${{ needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the App token (below) carries contents:write for the publish
      id-token: write # cosign keyless (Fulcio OIDC) + SLSA provenance
      attestations: write # actions/attest-build-provenance
    steps:
      # Short-lived scratchsmith-ci App token: its identity is what lets `knope
      # release`'s tag push trigger release.yml (a GITHUB_TOKEN-pushed tag would not,
      # due to recursion suppression).
      - name: Mint scratchsmith-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SCRATCHSMITH_CI_CLIENT_ID }}
          private-key: ${{ secrets.SCRATCHSMITH_CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify App token was minted
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::scratchsmith-ci App token mint produced an empty token; check SCRATCHSMITH_CI_CLIENT_ID / SCRATCHSMITH_CI_APP_PRIVATE_KEY and the App installation."
          exit 1
      # Check out the squash commit that landed on main (merge_commit_sha), NOT the
      # orphaned PR head — knope must tag a commit that is actually on main. Full
      # history + tags so knope can compare the bumped version against the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch built tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft (release SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Assemble, checksum, and sign
        run: |
          set -euo pipefail
          mkdir -p release
          # download-artifact laid each tarball under artifacts/dist-<name>/.
          find artifacts -name 'scratchsmith-*.tar.gz' -exec cp {} release/ \;
          # The matrix ships two arches; anything else means an upload went missing.
          count=$(find release -name 'scratchsmith-*.tar.gz' | wc -l)
          [ "$count" -eq 2 ] || { echo "::error::expected 2 tarballs, found ${count}"; exit 1; }
          # Release SBOM — scratchsmith's OWN Rust dependency graph (CycloneDX, via
          # syft). Sourced from Cargo.lock on purpose: the shipped binary is stripped
          # (profile.release strip=true), so a binary scan is empty; the lockfile is
          # the faithful, arch-independent dep record (one SBOM covers both arches).
          # Named to match the tag knope creates (v${version}); it rides checksums.txt,
          # so the one cosign signature + SLSA provenance below already cover it.
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::could not parse package version from Cargo.toml (got '${version}')"; exit 1 ;;
          esac
          syft scan file:Cargo.lock -o "cyclonedx-json=release/scratchsmith-v${version}.cdx.json"
          # syft exits 0 even when a cataloger finds nothing; assert the SBOM actually
          # captured components so a broken scan can't publish a hollow SBOM.
          components=$(jq '.components | length' "release/scratchsmith-v${version}.cdx.json")
          [ "${components:-0}" -gt 0 ] || { echo "::error::SBOM has no components — syft scan of Cargo.lock produced nothing"; exit 1; }
          cd release
          sha256sum scratchsmith-*.tar.gz scratchsmith-*.cdx.json > checksums.txt
          # Keyless-sign the checksums (GitHub OIDC → Fulcio). One signature over
          # checksums.txt transitively covers every tarball through its hash.
          cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes
          # Verify what we just signed: a bundle cosign cannot read would otherwise
          # ship green and only surface as a user bug report. The identity is this
          # workflow (signing runs at PR-merge, so the ref is the merge ref, not a
          # tag) — SLSA provenance below is the ref-agnostic primary verification.
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/knope-release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
      - name: Stage signed assets + fail-closed gate
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE" ] || { echo "::error::no provenance bundle produced"; exit 1; }
          cp "$BUNDLE" release/scratchsmith.intoto.jsonl
          mkdir -p dist/release-assets
          cp release/scratchsmith-*.tar.gz \
             release/scratchsmith-*.cdx.json \
             release/checksums.txt \
             release/checksums.txt.sigstore.json \
             release/scratchsmith.intoto.jsonl \
             dist/release-assets/
          # FAIL CLOSED — knope errors only on a globbed file that vanished, not on
          # one that was never built. This gate is what guarantees the published
          # (immutable) release is complete: 2 tarballs + SBOM + checksums + signature
          # + provenance, or abort before any publish.
          tarballs=$(find dist/release-assets -name 'scratchsmith-*.tar.gz' | wc -l)
          [ "$tarballs" -eq 2 ] || { echo "::error::expected 2 tarballs staged, found ${tarballs}"; exit 1; }
          sboms=$(find dist/release-assets -name 'scratchsmith-*.cdx.json' | wc -l)
          [ "$sboms" -eq 1 ] || { echo "::error::expected 1 SBOM staged, found ${sboms}"; exit 1; }
          for f in checksums.txt checksums.txt.sigstore.json scratchsmith.intoto.jsonl; do
            [ -s "dist/release-assets/${f}" ] || { echo "::error::missing staged asset ${f}"; exit 1; }
          done
          echo "staged $(find dist/release-assets -type f | wc -l) assets"
      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      # knope creates the draft, uploads dist/release-assets/*, and publishes (the
      # tag is created at publish). The App token (not GITHUB_TOKEN) is what lets the
      # published tag trigger release.yml. No-op when the version already has a
      # release (e.g. a re-run after a successful publish).
      - name: Create + publish the GitHub Release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
