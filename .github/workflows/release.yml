name: Release

# On a `v*` tag: build and push a signed multi-arch FROM scratch image to GHCR.
# The static binaries it packs come from the release that knope-release.yml just
# published — the image contains the exact signed, immutable release artifacts,
# not a fresh rebuild.
#
# The release tarballs + checksums + cosign signature + SLSA provenance are built,
# signed, staged, and PUBLISHED by knope-release.yml (which runs BEFORE the tag
# exists, so the GitHub Release locks immutable with its assets). knope creates the
# tag at publish as the scratchsmith-ci App; that tag push triggers this workflow.
#
# Verifying the GHCR image (identity is THIS workflow on the tag ref):
#   cosign verify ghcr.io/schubydoo/scratchsmith:<version> \
#     --certificate-identity-regexp '^https://github\.com/schubydoo/scratchsmith/\.github/workflows/release\.yml@refs/tags/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Verifying a downloaded release TARBALL is documented in knope-release.yml.
#
# Still to slot in: a Homebrew tap (Task 3.5, deferred — needs the tap repo).
# crates.io is deferred. A functional (non-scratch) runnable image is a planned
# follow-up.
#
# workflow_dispatch is a manual fallback to (re)build the image for an existing
# release — dispatch it FROM THE TAG (the "Use workflow from" picker lists tags),
# so github.ref_name is the tag whose assets are downloaded.
#
# NOTE: action refs are pinned to full commit SHAs (repo Actions policy +
# Scorecard Pinned-Dependencies); Renovate keeps them current. No Actions cache in
# this artifact-publishing workflow (cache-poisoning vector; zizmor).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Image pushes must not cancel each other.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Signed multi-arch image → GHCR
    # Only meaningful for a tag with a published release to source binaries from.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # download the published release assets
      packages: write # push to GHCR (registry provenance/SBOM go here via BuildKit)
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published release tarballs
        # Source the binaries from the release knope-release.yml published for this
        # tag, so the image packs the exact signed artifacts users download.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --pattern 'scratchsmith-*.tar.gz' --dir artifacts
      - name: Lay out dist/ for the Dockerfile
        # The FROM scratch image consumes just the two static binaries; the
        # Dockerfile selects dist/${TARGETARCH}/scratchsmith. Extract each from its
        # release tarball.
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64 /tmp/x
          tar -xzf artifacts/scratchsmith-*-linux-amd64.tar.gz -C /tmp/x
          tar -xzf artifacts/scratchsmith-*-linux-arm64.tar.gz -C /tmp/x
          cp /tmp/x/scratchsmith-*-linux-amd64/scratchsmith dist/amd64/scratchsmith
          cp /tmp/x/scratchsmith-*-linux-arm64/scratchsmith dist/arm64/scratchsmith
          chmod +x dist/amd64/scratchsmith dist/arm64/scratchsmith
          # Assert each binary is the arch its path claims — a tarball/glob mix-up
          # would otherwise sign and publish a wrong-arch image. arm64 can't be run
          # here without emulation, so this is its only gate.
          file dist/amd64/scratchsmith | grep -q 'x86-64' || { echo "::error::amd64 binary is not x86-64"; exit 1; }
          file dist/arm64/scratchsmith | grep -q 'aarch64' || { echo "::error::arm64 binary is not aarch64"; exit 1; }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # flavor.latest defaults to `auto`: :latest is emitted for a stable
          # semver tag and suppressed for a pre-release, so no explicit raw rule.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Smoke-run the amd64 image before publishing
        # Build the amd64 leg locally (load, no push) and actually run the binary,
        # so a broken image can't be pushed, tagged :latest, and signed. buildx
        # caches the layers, so the multi-arch build below reuses them.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scratchsmith:smoke
      - name: Run the smoke image
        run: |
          set -euo pipefail
          docker run --rm scratchsmith:smoke --version
          docker run --rm scratchsmith:smoke doctor >/dev/null
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # No RUN in the Dockerfile (COPY-only), so multi-arch needs no QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # SLSA provenance attestation in the registry
          sbom: true
      - name: Sign and verify the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          # --recursive also signs each per-platform manifest, not just the index,
          # so a consumer pinning a per-arch digest can still verify.
          cosign sign --yes --recursive "$ref"
          # Prove the signature is verifiable now, not via a later bug report.
          cosign verify "$ref" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
