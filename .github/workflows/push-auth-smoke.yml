name: Push auth smoke (live GHCR)

# Manual, opt-in end-to-end proof that `pack --push --sign` authenticates to a REAL token-auth
# registry (GHCR), completes the daemonless round-trip (pack -> push -> pull -> run), and that
# the cosign signature and SBOM attestation it creates both verify, with cosign and with
# `scratchsmith verify` (which must also reject a wrong identity or issuer). This exercises the
# username/password -> registry-token exchange path against real GHCR; the identity-token
# refresh-grant path is covered deterministically by the unit tests in src/registry.rs (a live
# identity-token source isn't reproducible here).
#
# workflow_dispatch ONLY: a push creates a package in this account's GHCR namespace, so it must
# never run unattended. It targets a dedicated throwaway package (`<repo>-authtest`) with a
# FIXED tag, kept separate from the real `scratchsmith` package. GITHUB_TOKEN can neither delete
# a package nor reliably make it private, so the final step self-cleans by deleting the whole
# throwaway package using a separate PAT secret, GHCR_CLEANUP_TOKEN (a fine-grained/classic PAT
# with delete:packages). Without that secret the cleanup step warns and skips, and the package
# must be deleted by hand. The `keep_package` input skips cleanup on purpose, so the signed
# image stays up for manual `cosign verify` checks; delete it by hand afterwards.

on:
  workflow_dispatch:
    inputs:
      keep_package:
        description: Keep the signed test image in GHCR instead of deleting it (delete it by hand later)
        type: boolean
        default: false

# Least privilege by default (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: push-auth-smoke
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dedicated throwaway package + fixed tag (overwritten each run).
  PUSH_REF: ghcr.io/${{ github.repository }}-authtest:smoke

jobs:
  push-ghcr:
    name: pack --push to real GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10 # its green runs take ~1-2 min; 10-minute floor, and it holds write tokens
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          rustflags: ""
      - name: Build scratchsmith
        run: cargo build --release --bin scratchsmith
      # docker login writes a username/password credential into ~/.docker/config.json, which
      # scratchsmith reads and hands to oci-client's token exchange — the real auth path.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install syft (for --sbom)
        uses: $/.github/actions/install-syft
      - name: Pack a tiny binary, push it to GHCR, sign it, and attest its SBOM
        run: |
          set -euo pipefail
          # /usr/bin/id is a dynamic glibc ELF — exactly what scratchsmith packs. Keep its name:
          # on runners where it is the uutils coreutils multicall binary, it picks the applet
          # from argv[0], so a renamed copy exits "unknown program".
          mkdir -p authtest && cp /usr/bin/id authtest/id
          ./target/release/scratchsmith pack --push "$PUSH_REF" --sign --sbom ./authtest/id
      - name: Pull it back from GHCR and run it (round-trip proof)
        run: |
          set -euo pipefail
          docker pull "$PUSH_REF"
          docker run --rm "$PUSH_REF"
      # Prove the signature scratchsmith created actually verifies. Identity is this
      # workflow via keyless OIDC; the regexp is ref-agnostic so it holds on any branch/tag.
      - name: Verify the signature with cosign
        run: |
          set -euo pipefail
          cosign verify "$PUSH_REF" \
            --certificate-identity-regexp '^https://github\.com/.+/\.github/workflows/push-auth-smoke\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # Same identity, for the CycloneDX SBOM attestation that `--sbom --sign` attached.
      - name: Verify the SBOM attestation with cosign
        run: |
          set -euo pipefail
          cosign verify-attestation "$PUSH_REF" \
            --type cyclonedx \
            --certificate-identity-regexp '^https://github\.com/.+/\.github/workflows/push-auth-smoke\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
      # The same checks through `scratchsmith verify` (TASK-258): the pass, a wrong identity and
      # a wrong issuer, each of which must exit exactly 1, and an unanchored pattern, which
      # must exit 2. `want` runs a command and checks its exit code.
      - name: Verify with scratchsmith verify
        run: |
          set -euo pipefail
          id='^https://github\.com/.+/\.github/workflows/push-auth-smoke\.yml@'
          issuer=https://token.actions.githubusercontent.com
          v() { ./target/release/scratchsmith verify "$@"; }
          want() {
            local code=$1; shift
            local got=0
            "$@" || got=$?
            if [ "$got" != "$code" ]; then
              echo "::error::expected exit $code, got $got: $*"
              exit 1
            fi
          }
          v "$PUSH_REF" --certificate-identity-regexp "$id" --certificate-oidc-issuer "$issuer" --sbom
          want 1 v "$PUSH_REF" \
            --certificate-identity-regexp '^https://github\.com/.+/\.github/workflows/not-this-workflow\.yml@' \
            --certificate-oidc-issuer "$issuer"
          want 1 v "$PUSH_REF" --certificate-identity-regexp "$id" \
            --certificate-oidc-issuer https://accounts.google.com
          want 2 v "$PUSH_REF" \
            --certificate-identity-regexp 'github\.com/.+/\.github/workflows/push-auth-smoke\.yml@' \
            --certificate-oidc-issuer "$issuer"
      # A signed one-entry index at a second tag of the same package, which the cleanup below
      # deletes with the rest. verify checks the index signature, and refuses --sbom on it.
      - name: Verify a signed index with scratchsmith verify
        run: |
          set -euo pipefail
          index="${PUSH_REF%:*}:smoke-index"
          ./target/release/scratchsmith index --sign "$index" "$PUSH_REF"
          id='^https://github\.com/.+/\.github/workflows/push-auth-smoke\.yml@'
          issuer=https://token.actions.githubusercontent.com
          ./target/release/scratchsmith verify "$index" \
            --certificate-identity-regexp "$id" --certificate-oidc-issuer "$issuer"
          got=0
          ./target/release/scratchsmith verify "$index" --sbom \
            --certificate-identity-regexp "$id" --certificate-oidc-issuer "$issuer" || got=$?
          if [ "$got" != 2 ]; then
            echo "::error::verify --sbom on an index exited $got, not 2"
            exit 1
          fi
      # Delete the throwaway package so it doesn't linger (public) in the namespace. Runs even
      # if an earlier step failed. GITHUB_TOKEN can't delete packages, so this uses a separate
      # PAT secret; without it, warn and skip rather than fail the run. `keep_package` skips it.
      - name: Delete the throwaway package
        if: always() && !inputs.keep_package
        env:
          CLEANUP_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}-authtest
        run: |
          set -euo pipefail
          if [ -z "${CLEANUP_TOKEN:-}" ]; then
            echo "::warning::GHCR_CLEANUP_TOKEN not set — leaving package '$PACKAGE'. Delete it by hand, or add the secret (a PAT with delete:packages) so future runs self-clean."
            exit 0
          fi
          # One dedicated package for this test, so delete the whole thing (not a single version).
          if GH_TOKEN="$CLEANUP_TOKEN" gh api --method DELETE "/user/packages/container/$PACKAGE"; then
            echo "Deleted throwaway package '$PACKAGE'."
          else
            echo "::warning::Could not delete '$PACKAGE' (already gone, or the token lacks delete:packages)."
          fi
      - name: Note the kept package
        if: always() && inputs.keep_package
        run: echo "::notice::keep_package is set, so cleanup was skipped. If this run pushed $PUSH_REF, it stays in GHCR. Delete the package by hand when done."
