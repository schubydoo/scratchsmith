name: Push auth smoke (live GHCR)

# Manual, opt-in end-to-end proof that `pack --push --sign` authenticates to a REAL token-auth
# registry (GHCR), completes the daemonless round-trip (pack -> push -> pull -> run), and that
# the cosign signature it creates verifies (Task 4.4 AC). This exercises the username/password
# -> registry-token exchange path against real GHCR; the identity-token refresh-grant path is
# covered deterministically by the unit tests in src/registry.rs (a live identity-token source
# isn't reproducible here). SBOM attestation (`--sbom --sign`) is unit-tested for arg/predicate
# shape; live `cosign verify-attestation` waits on wiring syft into this workflow.
#
# workflow_dispatch ONLY: a push creates a package in this account's GHCR namespace, so it must
# never run unattended. It targets a dedicated throwaway package (`<repo>-authtest`) with a
# FIXED tag, kept separate from the real `scratchsmith` package. GITHUB_TOKEN can neither delete
# a package nor reliably make it private, so the final step self-cleans by deleting the whole
# throwaway package using a separate PAT secret, GHCR_CLEANUP_TOKEN (a fine-grained/classic PAT
# with delete:packages). Without that secret the cleanup step warns and skips, and the package
# must be deleted by hand.

on:
  workflow_dispatch:

# Least privilege by default (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: push-auth-smoke
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dedicated throwaway package + fixed tag (overwritten each run).
  PUSH_REF: ghcr.io/${{ github.repository }}-authtest:smoke

jobs:
  push-ghcr:
    name: pack --push to real GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build scratchsmith
        run: cargo build --release --bin scratchsmith
      # docker login writes a username/password credential into ~/.docker/config.json, which
      # scratchsmith reads and hands to oci-client's token exchange — the real auth path.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Pack a tiny binary, push it to GHCR, and sign it
        run: |
          set -euo pipefail
          # /usr/bin/id is a small dynamic glibc ELF — exactly what scratchsmith packs.
          cp /usr/bin/id ./authtest-bin
          ./target/release/scratchsmith pack --push "$PUSH_REF" --sign ./authtest-bin
      - name: Pull it back from GHCR and run it (round-trip proof)
        run: |
          set -euo pipefail
          docker pull "$PUSH_REF"
          docker run --rm "$PUSH_REF"
      # Prove the signature scratchsmith created actually verifies (AC 4.4). Identity is this
      # workflow via keyless OIDC; the regexp is ref-agnostic so it holds on any branch/tag.
      - name: Verify the signature with cosign
        run: |
          set -euo pipefail
          cosign verify "$PUSH_REF" \
            --certificate-identity-regexp '^https://github\.com/.+/\.github/workflows/push-auth-smoke\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # Delete the throwaway package so it doesn't linger (public) in the namespace. Runs even
      # if an earlier step failed. GITHUB_TOKEN can't delete packages, so this uses a separate
      # PAT secret; without it, warn and skip rather than fail the run.
      - name: Delete the throwaway package
        if: always()
        env:
          CLEANUP_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}-authtest
        run: |
          set -euo pipefail
          if [ -z "${CLEANUP_TOKEN:-}" ]; then
            echo "::warning::GHCR_CLEANUP_TOKEN not set — leaving package '$PACKAGE'. Delete it by hand, or add the secret (a PAT with delete:packages) so future runs self-clean."
            exit 0
          fi
          # One dedicated package for this test, so delete the whole thing (not a single version).
          if GH_TOKEN="$CLEANUP_TOKEN" gh api --method DELETE "/user/packages/container/$PACKAGE"; then
            echo "Deleted throwaway package '$PACKAGE'."
          else
            echo "::warning::Could not delete '$PACKAGE' (already gone, or the token lacks delete:packages)."
          fi
