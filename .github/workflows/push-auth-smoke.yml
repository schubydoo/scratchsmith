name: Push auth smoke (live GHCR)

# Manual, opt-in end-to-end proof that `pack --push` authenticates to a REAL token-auth
# registry (GHCR) and completes the daemonless round-trip: pack a tiny binary, push it, then
# pull it back and run it. This exercises the username/password -> registry-token exchange
# path against real GHCR. The identity-token refresh-grant path is covered deterministically
# by the unit tests in src/registry.rs (a live identity-token source isn't reproducible here).
#
# workflow_dispatch ONLY: a push creates a package in this account's GHCR namespace, so it must
# never run unattended. It targets a dedicated throwaway package (`<repo>-authtest`) with a
# FIXED tag, so each run overwrites the previous manifest rather than piling up tags on the
# real `scratchsmith` package. GITHUB_TOKEN cannot delete package versions, so there is no
# auto-cleanup — that separate, clearly-named package is the containment.

on:
  workflow_dispatch:

# Least privilege by default (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: push-auth-smoke
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dedicated throwaway package + fixed tag (overwritten each run).
  PUSH_REF: ghcr.io/${{ github.repository }}-authtest:smoke

jobs:
  push-ghcr:
    name: pack --push to real GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build scratchsmith
        run: cargo build --release --bin scratchsmith
      # docker login writes a username/password credential into ~/.docker/config.json, which
      # scratchsmith reads and hands to oci-client's token exchange — the real auth path.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack a tiny binary and push it straight to GHCR
        run: |
          set -euo pipefail
          # /usr/bin/id is a small dynamic glibc ELF — exactly what scratchsmith packs.
          cp /usr/bin/id ./authtest-bin
          ./target/release/scratchsmith pack --push "$PUSH_REF" ./authtest-bin
      - name: Pull it back from GHCR and run it (round-trip proof)
        run: |
          set -euo pipefail
          docker pull "$PUSH_REF"
          docker run --rm "$PUSH_REF"
