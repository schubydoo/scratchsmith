name: Prepare Release

# knope's "release PR" half. On push to main, if pending changeset fragments
# warrant a release, knope bumps the version + CHANGELOG, resyncs Cargo.lock,
# force-pushes the `release` branch, and opens/refreshes a
# `chore: prepare release X.Y.Z` PR. Merging that PR triggers knope-release.yml.
#
# workflow_dispatch with `override_version` forces a specific version — the
# pre-1.0 escape hatch to cut 0.x → 1.0.0 (knope otherwise only ever bumps the
# minor on a 0.x line). Blank input = normal changeset-computed bump.
#
# Gated on the `KNOPE_ENABLED` repo variable. Needs the scratchsmith-ci GitHub App
# installed (SCRATCHSMITH_CI_CLIENT_ID / SCRATCHSMITH_CI_APP_PRIVATE_KEY secrets),
# whose identity is what lets the merge tag trigger the signed build.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_version:
        description: "Force this version (e.g. 1.0.0). Blank = normal changeset bump."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: knope-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ vars.KNOPE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Detect a pending changeset FIRST, credential-less, so a routine push with
      # no fragment is a clean no-op that never touches the App. A dispatch with
      # override_version also proceeds (an intentional cut).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect pending changesets
        id: changesets
        env:
          OVERRIDE: ${{ github.event.inputs.override_version }}
        run: |
          set -euo pipefail
          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'README.md' | wc -l)
          fi
          has=false
          if [ "$count" -gt 0 ] || [ -n "$OVERRIDE" ]; then has=true; fi
          echo "has=$has" >> "$GITHUB_OUTPUT"
          echo "pending changeset fragments: $count; override: '${OVERRIDE:-}'"
      # Short-lived scratchsmith-ci App token: its identity is what lets the release
      # PR's merge tag trigger the signed build (a GITHUB_TOKEN-pushed tag would not,
      # due to recursion suppression), and lets CI run on the release PR.
      - name: Mint scratchsmith-ci App token
        id: app-token
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SCRATCHSMITH_CI_CLIENT_ID }}
          private-key: ${{ secrets.SCRATCHSMITH_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Verify App token was minted
        if: ${{ steps.changesets.outputs.has == 'true' && steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::scratchsmith-ci App token mint produced an empty token; check SCRATCHSMITH_CI_CLIENT_ID / SCRATCHSMITH_CI_APP_PRIVATE_KEY and the App installation."
          exit 1
      # Re-checkout with the App token persisted so knope's push of the release
      # branch and the PR it opens run as the App identity. Full history + tags so
      # knope can find the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.changesets.outputs.has == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ steps.changesets.outputs.has == 'true' }}
      - name: Configure git identity (scratchsmith-ci App)
        if: ${{ steps.changesets.outputs.has == 'true' }}
        run: |
          git config user.name "scratchsmith-ci[bot]"
          git config user.email "scratchsmith-ci[bot]@users.noreply.github.com"
      - name: Install knope
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Open or refresh the release PR
        if: ${{ steps.changesets.outputs.has == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OVERRIDE: ${{ github.event.inputs.override_version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            knope prepare-release --verbose --override-version "$OVERRIDE"
          else
            knope prepare-release --verbose
          fi
