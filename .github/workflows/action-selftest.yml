name: Action self-test

# Exercises action.yml end-to-end: it downloads the latest RELEASED scratchsmith binary and
# packs a real dynamic glibc binary (both the image path and the --output rootfs path). This
# validates the action wiring, not the PR's own build (the action ships releases, not HEAD).
# Runs only when the action or this workflow changes — it needs a published release to download.

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-selftest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # /usr/bin/id is a dynamic glibc binary that touches NSS — a fair smoke of the
      # whole resolve → stage → assemble path.
      - name: Pack a system binary → image
        id: image
        uses: $/
        with:
          binary: /usr/bin/id
          strip: "true"
          smoke: "true"
      - name: Assert the image loaded and runs
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::action produced no image output"; exit 1; }
          docker image inspect "$IMAGE" >/dev/null
          docker run --rm "$IMAGE"        # prints uid=65532 (non-root default)
          echo "packed and ran $IMAGE"
      - name: Pack the same binary → rootfs only (no daemon)
        id: rootfs
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged
      - name: Assert the rootfs staged
        env:
          ROOTFS: ${{ steps.rootfs.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::action produced no rootfs output"; exit 1; }
          test -e "$ROOTFS/usr/bin/id"    # staged at its verbatim path
          echo "staged rootfs at $ROOTFS"
      # Exercise the image-config inputs so a wiring regression (especially the multi-line list
      # inputs) fails here — entrypoint/cmd/env/workdir/user/label/healthcheck, each asserted via
      # docker inspect below. max-size and scan are build guards (not image-config fields), so they
      # get their own pass/fail tests further down.
      - name: Pack with image-config inputs → image
        id: meta
        uses: $/
        with:
          binary: /usr/bin/id
          entrypoint: /usr/bin/id
          cmd: |
            --version
          env: |
            LANG=C.UTF-8
          workdir: /tmp
          user: "1000:1000"
          label: |
            role=selftest
          healthcheck: |
            /usr/bin/id
            --version
      - name: Assert the config inputs reached the image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::config-inputs pack produced no image output"; exit 1; }
          inspect="$(docker image inspect "$IMAGE")"
          echo "$inspect" | jq -e '.[0].Config.Entrypoint == ["/usr/bin/id"]' >/dev/null
          echo "$inspect" | jq -e '(.[0].Config.Cmd // []) | index("--version")' >/dev/null
          echo "$inspect" | jq -e '(.[0].Config.Env // []) | index("LANG=C.UTF-8")' >/dev/null
          echo "$inspect" | jq -e '.[0].Config.WorkingDir == "/tmp"' >/dev/null
          echo "$inspect" | jq -e '.[0].Config.User == "1000:1000"' >/dev/null
          echo "$inspect" | jq -e '.[0].Config.Labels.role == "selftest"' >/dev/null
          echo "$inspect" | jq -e '(.[0].Config.Healthcheck.Test // []) | index("/usr/bin/id")' >/dev/null
          echo "config inputs verified"
      # max-size is a build guard, so prove it by tripping it: a 1KB budget is far below the real
      # staged size, so the pack MUST fail. A dropped --max-size would let it pass — caught here.
      - name: Pack with an impossible max-size (must fail the build)
        id: maxsize
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          max-size: 1KB
      - name: Assert the max-size gate tripped
        env:
          OUTCOME: ${{ steps.maxsize.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::a 1KB max-size should have failed the pack but it was '$OUTCOME' — is --max-size wired in action.yml?"; exit 1; }
          echo "max-size gate verified (1KB budget correctly rejected)"
      # The `scan` input needs grype on the runner (the action preflights for it). Install it, then
      # scan the packed rootfs. No --scan-fail-on, so findings never gate this smoke of the wiring.
      - name: Install grype (for the scan input)
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      # download-grype only outputs an absolute path (`cmd`); it does not add grype to PATH. The
      # action preflights with `command -v grype`, so put grype's dir on PATH for the next step.
      - name: Put grype on PATH
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: dirname "$GRYPE_CMD" >> "$GITHUB_PATH"
      - name: Pack with the scan input → image
        id: scan
        uses: $/
        with:
          binary: /usr/bin/id
          scan: "true"
      - name: Assert the scan pack produced an image and grype actually ran
        env:
          IMAGE: ${{ steps.scan.outputs.image }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::scan pack produced no image output"; exit 1; }
          # The report's `.scan` object is populated only when grype ran; null otherwise. Asserting
          # it proves `--scan` was actually passed — a dropped scan input still builds an image, so
          # an image check alone would not catch that regression.
          echo "$REPORT" | jq -e '.scan != null' >/dev/null || { echo "::error::report.scan is null — was --scan dropped from action.yml?"; exit 1; }
          echo "scan input wired (grype ran, pack succeeded)"
      # deny/require each need TWO complementary cases. The positive one (an absent lib packs
      # cleanly) pins the flag NAME: a wrong name in action.yml fails on "unexpected argument".
      # The trip one (a shipping lib denied / an absent lib required) pins the WIRING:
      # check_lib_policy short-circuits when both lists are empty, so a dropped loop makes the
      # positive pass falsely, and only the trip catches it.
      - name: Pack denying an absent library (must succeed)
        id: deny
        uses: $/
        with:
          binary: /usr/bin/id
          deny: |
            libnot-a-real-lib.so.99
      - name: Assert the deny pack produced an image
        env:
          IMAGE: ${{ steps.deny.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::deny of an absent library produced no image — is --deny wired in action.yml?"; exit 1; }
          echo "deny name wired"
      # Trip half: /usr/bin/id links libc.so.6, so denying it MUST fail the pack. If the --deny
      # loop is dropped from action.yml, the list is empty, the policy is skipped, and the pack
      # succeeds — caught here.
      - name: Pack denying a library that ships (must fail)
        id: deny-trip
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          deny: |
            libc.so.6
      - name: Assert the deny gate tripped
        env:
          OUTCOME: ${{ steps.deny-trip.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::denying libc.so.6 packed anyway — was the --deny wiring dropped from action.yml?"; exit 1; }
          echo "deny gate verified"
      # require of a library that DOES ship (/usr/bin/id links libc.so.6) is satisfied, so it
      # must pack cleanly; a wrong flag name would fail on "unexpected argument".
      - name: Pack requiring a library that ships (must succeed)
        id: require
        uses: $/
        with:
          binary: /usr/bin/id
          require: |
            libc.so.6
      - name: Assert the require pack produced an image
        env:
          IMAGE: ${{ steps.require.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::require of a shipping library produced no image — is --require wired in action.yml?"; exit 1; }
          echo "require name wired"
      # Trip half: requiring a library that does NOT ship MUST fail the pack. A dropped --require
      # loop leaves the list empty, the policy is skipped, and the pack succeeds — caught here.
      - name: Pack requiring an absent library (must fail)
        id: require-trip
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          require: |
            libnot-a-real-lib.so.99
      - name: Assert the require gate tripped
        env:
          OUTCOME: ${{ steps.require-trip.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::requiring an absent library packed anyway — was the --require wiring dropped from action.yml?"; exit 1; }
          echo "require gate verified"
      # nss=none stages no nsswitch.conf, while the default stages one. Pack to a rootfs and
      # assert the file is absent: this fails if the input is dropped (default stages it) and if
      # the value is mangled (the pack fails, so no rootfs).
      - name: Pack with nss=none → rootfs
        id: nss
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-nss
          nss: none
      - name: Assert nss=none staged no nsswitch.conf
        env:
          ROOTFS: ${{ steps.nss.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::nss=none pack produced no rootfs — is --nss wired in action.yml?"; exit 1; }
          test ! -e "$ROOTFS/etc/nsswitch.conf" || { echo "::error::nss=none staged an nsswitch.conf — the --nss value did not reach the stager"; exit 1; }
          echo "nss input wired (none staged no nsswitch.conf)"
      # add-file is the one input that puts a caller-chosen file in the image, so the positive
      # case pins the wiring by itself: drop the input and the asserted paths are simply absent.
      # Two lines exercise the per-line loop — one relocated (SRC:DST), one mirrored (bare SRC).
      - name: Write a file for the add-file input to copy
        run: echo "scratchsmith action selftest" > ./selftest-note.txt
      - name: Pack with add-file → rootfs
        id: addfile
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-add-file
          add-file: |
            ./selftest-note.txt:/etc/selftest-note.txt
            /etc/hostname
      - name: Assert add-file staged both files
        env:
          ROOTFS: ${{ steps.addfile.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::add-file pack produced no rootfs — is --add-file wired in action.yml?"; exit 1; }
          grep -q "scratchsmith action selftest" "$ROOTFS/etc/selftest-note.txt" || { echo "::error::add-file did not copy ./selftest-note.txt to /etc/selftest-note.txt"; exit 1; }
          test -e "$ROOTFS/etc/hostname" || { echo "::error::a bare absolute add-file did not mirror /etc/hostname into the image"; exit 1; }
          echo "add-file input wired (relocated and mirrored)"
      # Trip half: --add-file takes regular files only, so a directory source MUST fail the pack.
      # This also pins the value reaching the CLI verbatim — a mangled spec fails differently but
      # still fails, so the positive case above is what proves the happy path.
      - name: Pack add-file with a directory source (must fail)
        id: addfile-trip
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          add-file: /etc:/etc-copy
      - name: Assert the add-file directory guard tripped
        env:
          OUTCOME: ${{ steps.addfile-trip.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::add-file of a directory packed anyway — was the --add-file wiring dropped from action.yml?"; exit 1; }
          echo "add-file directory guard verified"
      # --locale stages a COMPILED locale, so the runner must be able to supply one. The runner
      # image ships no en_US directory, so localedef compiles it from /usr/share/i18n. Assert
      # that source rather than skipping when it is absent: a self-skipping selftest proves
      # nothing, and a runner image that drops the locale sources must fail loudly here instead
      # of turning this pair into a quiet no-op.
      - name: Assert the runner can supply locale data
        run: |
          set -euo pipefail
          # Either source the stager accepts will do, in the order it tries them: a prebuilt
          # host directory first, else localedef compiling from the glibc sources.
          if [ -d /usr/lib/locale/en_US.UTF-8 ]; then
            echo "locale source present (prebuilt directory)"
          elif command -v localedef >/dev/null 2>&1 && [ -e /usr/share/i18n/locales/en_US ]; then
            echo "locale source present (localedef will compile it)"
          else
            echo "::error::the runner has neither a prebuilt en_US.UTF-8 directory nor localedef plus /usr/share/i18n/locales/en_US — the locale selftest has nothing to stage"
            exit 1
          fi
      - name: Pack with locale → rootfs
        id: locale
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-locale
          locale: en_US.UTF-8
          # Illustrative, and not asserted here: it mirrors the documented pairing (staging a
          # locale does not select it) and keeps the pack's selection warning quiet. The `env`
          # input itself is covered by the image-config job above, which can read it back.
          env: LANG=en_US.UTF-8
      - name: Assert the locale staged and the archive did not
        env:
          ROOTFS: ${{ steps.locale.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::locale pack produced no rootfs — is --locale wired in action.yml?"; exit 1; }
          test -e "$ROOTFS/usr/lib/locale/en_US.UTF-8/LC_CTYPE" || { echo "::error::locale input did not stage en_US.UTF-8"; exit 1; }
          # Exactly one entry: the host locale-archive holds every locale the host has, and it
          # must never ride along. Counting catches a change that copies the whole root.
          count="$(find "$ROOTFS/usr/lib/locale" -mindepth 1 -maxdepth 1 | wc -l)"
          [ "$count" = "1" ] || { echo "::error::expected exactly one entry under /usr/lib/locale, found $count"; exit 1; }
          echo "locale input wired (en_US.UTF-8 staged, archive excluded)"
      # Trip half: --locale takes a NAME, never a path, so a path must fail the pack. This also
      # pins the value reaching the CLI verbatim.
      - name: Pack with a locale path instead of a name (must fail)
        id: locale-trip
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          locale: /usr/lib/locale/en_US.UTF-8
      - name: Assert the locale name guard tripped
        env:
          OUTCOME: ${{ steps.locale-trip.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::a locale path packed anyway — was the --locale wiring dropped from action.yml?"; exit 1; }
          echo "locale name guard verified"
      # symlinks covers each add-file source, so the positive case pins the wiring by itself:
      # under the copy-all default the staged entry is a regular file and `test -L` fails.
      - name: Write a symlinked file for the symlinks input to preserve
        run: |
          set -euo pipefail
          echo "scratchsmith symlink selftest" > "${RUNNER_TEMP}/ss-note.txt"
          # A RELATIVE link value, so the preserved link can resolve inside the image. An
          # absolute host path would stage as a dangling link and prove less.
          ln -sf ss-note.txt "${RUNNER_TEMP}/ss-link.txt"
      - name: Pack with symlinks=preserve → rootfs
        id: symlinks
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-symlinks
          symlinks: preserve
          add-file: |
            ${{ runner.temp }}/ss-note.txt:/etc/ss-note.txt
            ${{ runner.temp }}/ss-link.txt:/etc/ss-link.txt
      - name: Assert the symlink stayed a symlink and resolves in the image
        env:
          ROOTFS: ${{ steps.symlinks.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::symlinks pack produced no rootfs — is --symlinks wired in action.yml?"; exit 1; }
          test -L "$ROOTFS/etc/ss-link.txt" || { echo "::error::symlinks=preserve staged a regular file — the input never reached --symlinks"; exit 1; }
          grep -q "scratchsmith symlink selftest" "$ROOTFS/etc/ss-link.txt" || { echo "::error::the preserved link does not resolve inside the staged tree"; exit 1; }
          echo "symlinks input wired (preserve kept the link, and it resolves in the image)"
      # Trip half: --symlinks takes one of four modes, so clap must reject anything else. A
      # value this script mangled on the way would fail differently but still fail, so the
      # positive case above is what proves the happy path.
      - name: Pack with an unknown symlinks mode (must fail)
        id: symlinks-trip
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          symlinks: not-a-mode
      - name: Assert the symlinks mode guard tripped
        env:
          OUTCOME: ${{ steps.symlinks-trip.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::an unknown symlinks mode packed anyway — was the --symlinks wiring dropped from action.yml?"; exit 1; }
          echo "symlinks mode guard verified"
      # ---- Inputs that had no selftest until now. Each step asserts the EFFECT of the flag, so
      # ---- a wrong flag name and a dropped mapping both fail it.
      #
      # ca-certs and tz each add one fixed file, so one rootfs pack proves both.
      - name: Pack with ca-certs and tz → rootfs
        id: extras
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-extras
          ca-certs: "true"
          tz: "true"
      - name: Assert the CA bundle and the timezone were staged
        env:
          ROOTFS: ${{ steps.extras.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::the extras pack produced no rootfs"; exit 1; }
          test -s "$ROOTFS/etc/ssl/certs/ca-certificates.crt" || { echo "::error::no CA bundle in the rootfs — is --ca-certs wired in action.yml?"; exit 1; }
          test -s "$ROOTFS/etc/localtime" || { echo "::error::no /etc/localtime in the rootfs — is --tz wired in action.yml?"; exit 1; }
          echo "ca-certs and tz inputs wired"
      # include force-stages a library the binary does not link. /usr/bin/id does not need
      # libz, and zlib1g is on every ubuntu runner.
      - name: Pack with an included library → rootfs
        id: include
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-include
          include: |
            libz.so.1
      - name: Assert the included library was staged
        env:
          ROOTFS: ${{ steps.include.outputs.rootfs }}
        run: |
          set -euo pipefail
          [ -n "$ROOTFS" ] || { echo "::error::the include pack produced no rootfs"; exit 1; }
          [ -n "$(find "$ROOTFS" -name 'libz.so.1*' -print -quit)" ] || { echo "::error::libz.so.1 is not in the rootfs — is --include wired in action.yml?"; exit 1; }
          echo "include input wired"
      # args is the verbatim escape hatch. A label is the cheapest flag to observe from outside.
      - name: Pack with a raw flag through args → image
        id: rawargs
        uses: $/
        with:
          binary: /usr/bin/id
          args: --label selftest.args=reached
      - name: Assert the raw flag reached the CLI
        env:
          IMAGE: ${{ steps.rawargs.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::the args pack produced no image"; exit 1; }
          got="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "selftest.args" }}')"
          [ "$got" = "reached" ] || { echo "::error::the label from args is '$got' — is the args input still appended in action.yml?"; exit 1; }
          echo "args input wired"
      # upx and init each need a tool the runner does not carry; the action preflights for upx.
      - name: Install upx and tini (for the upx and init inputs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends upx-ucl tini
      - name: Pack with upx → image
        id: upx
        uses: $/
        with:
          binary: /usr/bin/id
          upx: "true"
      - name: Assert the binary was compressed
        env:
          REPORT: ${{ steps.upx.outputs.report }}
        run: |
          set -euo pipefail
          # `.size.upx` is true only when upx ran on the binary.
          echo "$REPORT" | jq -e '.size.upx == true' >/dev/null || { echo "::error::report.size.upx is not true — is --upx wired in action.yml?"; exit 1; }
          echo "upx input wired"
      - name: Pack with init → image
        id: init
        uses: $/
        with:
          binary: /usr/bin/id
          init: "true"
      - name: Assert tini wraps the entrypoint and the image still runs
        env:
          IMAGE: ${{ steps.init.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::the init pack produced no image"; exit 1; }
          first="$(docker image inspect "$IMAGE" --format '{{ index .Config.Entrypoint 0 }}')"
          [ "$first" = "/tini" ] || { echo "::error::the entrypoint starts with '$first', not /tini — is --init wired in action.yml?"; exit 1; }
          docker run --rm "$IMAGE" >/dev/null
          echo "init input wired"
      # sbom, sbom-format and sbom-file travel together: sbom turns the SBOM on, and the other
      # two only matter with it. A non-default format and path prove all three.
      - name: Install syft (for the sbom inputs)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Pack with an SPDX SBOM at a chosen path → rootfs
        id: sbom
        uses: $/
        with:
          binary: /usr/bin/id
          output: ./staged-sbom
          sbom: "true"
          sbom-format: spdx-json
          sbom-file: ${{ runner.temp }}/ss-selftest.spdx.json
      - name: Assert the SBOM is SPDX and sits at the chosen path
        env:
          REPORT: ${{ steps.sbom.outputs.report }}
          SBOM: ${{ runner.temp }}/ss-selftest.spdx.json
        run: |
          set -euo pipefail
          test -s "$SBOM" || { echo "::error::no SBOM at the sbom-file path — are --sbom and --sbom-file wired in action.yml?"; exit 1; }
          # Only an SPDX document has this key; the default format is CycloneDX.
          jq -e '.spdxVersion | startswith("SPDX-")' "$SBOM" >/dev/null || { echo "::error::the SBOM is not SPDX — is --sbom-format wired in action.yml?"; exit 1; }
          echo "$REPORT" | jq -e --arg p "$SBOM" '.sbom == $p' >/dev/null || { echo "::error::report.sbom does not name the sbom-file path"; exit 1; }
          echo "sbom, sbom-format and sbom-file inputs wired"
      # scan-fail-on: a real severity would pass or fail on whatever the vulnerability database
      # says that day, so the stable proof is the trip. clap rejects an unknown severity, and
      # it can only do that if the value reached --scan-fail-on. grype is on PATH from above.
      - name: Pack with an unknown scan-fail-on severity (must fail)
        id: failon-trip
        continue-on-error: true
        uses: $/
        with:
          binary: /usr/bin/id
          scan-fail-on: not-a-severity
      - name: Assert the scan-fail-on value reached the CLI
        env:
          OUTCOME: ${{ steps.failon-trip.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::an unknown scan-fail-on severity packed anyway — was the --scan-fail-on wiring dropped from action.yml?"; exit 1; }
          echo "scan-fail-on input wired"
      # push tags the built image and runs `docker push`. A throwaway local registry takes it,
      # so no login and no real registry are involved.
      - name: Start a local registry (for the push input)
        run: docker run -d --rm -p 127.0.0.1:5000:5000 --name ss-selftest-registry registry:2
      - name: Pack and push → local registry
        id: push
        uses: $/
        with:
          binary: /usr/bin/id
          push: localhost:5000/selftest/id:pushed
      - name: Assert the registry holds the pushed tag
        run: |
          set -euo pipefail
          tags="$(curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:5000/v2/selftest/id/tags/list)"
          echo "$tags" | jq -e '.tags | index("pushed")' >/dev/null || { echo "::error::the registry does not hold selftest/id:pushed (got: $tags) — is the push input still wired in action.yml?"; exit 1; }
          docker stop ss-selftest-registry >/dev/null
          echo "push input wired"
      # version picks the release to download. This step is LAST on purpose: every step above
      # runs the default release, and an older binary must not be the one they exercise. An
      # older release than the default proves the input is honored and not just accepted.
      - name: Pack with a pinned older release → rootfs
        id: pinned
        uses: $/
        with:
          binary: /usr/bin/id
          version: v1.5.0
          output: ./staged-pinned
      - name: Assert the pinned release is the one that ran
        run: |
          set -euo pipefail
          got="$("${RUNNER_TEMP}/scratchsmith-bin/scratchsmith" --version)"
          [ "$got" = "scratchsmith 1.5.0" ] || { echo "::error::the action ran '$got', not 1.5.0 — is the version input still honored in action.yml?"; exit 1; }
          echo "version input wired"
