# The `ci` profile emits a JUnit report at target/nextest/ci/junit.xml — the only
# format Codecov Test Analytics ingests (see .github/workflows/ci.yml).
[profile.ci.junit]
path = "junit.xml"

# The pack integration tests build/run Docker images under a shared tag and touch
# global Docker state. nextest runs each test in its own process, so the in-test
# Mutex can't serialize them — a max-1 test group does (applies to every profile).
[test-groups]
serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(pack)'
test-group = 'serial'
