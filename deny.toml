# cargo-deny configuration (TAD §6 supply-chain gate). The license allow-list
# covers scratchsmith's current dependency tree (clap, goblin, tar, flate2,
# sha2, serde, toml, walkdir, tempfile, anyhow, …); extend as deps land.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
version = 2
confidence-threshold = 0.9
# Silence "license was not encountered" for forward-looking entries.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Mozilla's bundled CA root set (webpki-root-certs), pulled in transitively by
    # reqwest's rustls platform verifier for the registry-push TLS. A permissive data
    # license for the certificate set, not code.
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
