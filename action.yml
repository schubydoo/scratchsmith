name: Scratchsmith
description: Pack a prebuilt dynamic glibc Linux binary into a minimal, non-root FROM scratch OCI image, no Dockerfile.
author: schubydoo
branding:
  icon: package
  color: orange

# Composite (not Docker): `pack` needs docker + ldconfig (and optionally syft/grype) on the runner,
# which the FROM scratch release image deliberately lacks. So this downloads the signed release
# binary for the runner arch, verifies it against the release checksums, and runs `pack` on the
# GitHub-hosted runner (which has Docker). Inputs map to real `pack` flags; the `args` input is the
# escape hatch for anything without a dedicated input. `--sign` and `--runtime` are deliberately left
# to `args`: signing needs `pack --push --sign`, and this action publishes with `docker push` (not the
# daemonless push) — which also means the load engine must be docker, so `--runtime podman|nerdctl`
# (loads into that engine's store, invisible to `docker push`) has no first-class input here.

inputs:
  binary:
    description: Path to the dynamically linked glibc ELF binary to pack.
    required: true
  version:
    description: >-
      scratchsmith release to use — a tag like `v0.1.2`, or `latest`. Defaults to the ref this
      action was called with when that is a version tag (so `@v0.1.2` uses the v0.1.2 CLI), else
      `latest`.
    required: false
    default: ""
  output:
    description: If set, stage the rootfs into this directory instead of building an image (`--no-build`).
    required: false
    default: ""
  user:
    description: Image user `UID[:GID]`. Empty keeps the non-root default (65532); `0` warns.
    required: false
    default: ""
  strip:
    description: Strip symbols from the binary and libraries.
    required: false
    default: "false"
  smoke:
    description: After building, run the image once and fail if the binary can't start.
    required: false
    default: "false"
  sbom:
    description: Generate an SBOM of the packed rootfs (requires `syft` on the runner).
    required: false
    default: "false"
  sbom-format:
    description: SBOM format (`cyclonedx-json` or `spdx-json`) when `sbom` is enabled.
    required: false
    default: cyclonedx-json
  ca-certs:
    description: Add the TLS CA bundle to the image.
    required: false
    default: "false"
  tz:
    description: Add the resolved local timezone to the image.
    required: false
    default: "false"
  init:
    description: Add a minimal init (tini) as pid 1 wrapping the entrypoint.
    required: false
    default: "false"
  include:
    description: Extra libraries to force-stage (e.g. dlopen'd plugins), one soname/path per line.
    required: false
    default: ""
  entrypoint:
    description: Image ENTRYPOINT. Empty defaults to the packed binary's path.
    required: false
    default: ""
  cmd:
    description: Default arguments appended to the entrypoint, one per line.
    required: false
    default: ""
  env:
    description: Image environment entries, one `KEY=VALUE` per line.
    required: false
    default: ""
  workdir:
    description: Image WORKDIR.
    required: false
    default: ""
  label:
    description: OCI image labels, one `KEY=VALUE` per line.
    required: false
    default: ""
  healthcheck:
    description: >-
      Container HEALTHCHECK in exec form — one token per line (e.g. `/app`, then `--health`). It runs
      inside the scratch image, so it must name an executable present there, typically the binary.
    required: false
    default: ""
  upx:
    description: Compress the packed binary with UPX (it self-decompresses at runtime).
    required: false
    default: "false"
  sbom-file:
    description: SBOM output path (default `sbom.json`). Requires `sbom` enabled — ignored on its own.
    required: false
    default: ""
  scan:
    description: Vulnerability-scan the packed rootfs with grype (reuses the SBOM if `sbom` is set).
    required: false
    default: "false"
  scan-fail-on:
    description: >-
      Fail the pack on a grype finding at or above this severity
      (`negligible`/`low`/`medium`/`high`/`critical`). Implies `scan`.
    required: false
    default: ""
  max-size:
    description: >-
      Fail the pack if the fully-staged image exceeds this size — e.g. `12MB`, `512KiB`, or a bare
      byte count (K/M/G are x1000, Ki/Mi/Gi are x1024).
    required: false
    default: ""
  args:
    description: Extra raw `pack` flags appended verbatim (escape hatch for anything not mapped above).
    required: false
    default: ""
  push:
    description: >-
      If set to a registry ref (e.g. `ghcr.io/you/app:tag`), tag the built image as this and
      `docker push` it. Requires a prior registry login (e.g. docker/login-action) and an image
      build (not compatible with `output`).
    required: false
    default: ""

outputs:
  image:
    description: The loaded image tag (empty when `output` staged a rootfs instead).
    value: ${{ steps.pack.outputs.image }}
  rootfs:
    description: The staged rootfs directory (empty when an image was built).
    value: ${{ steps.pack.outputs.rootfs }}
  report:
    description: The full pack report as JSON.
    value: ${{ steps.pack.outputs.report }}

runs:
  using: composite
  steps:
    # cosign verifies the release's signed checksums manifest (authenticity), below.
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Download and verify the scratchsmith binary
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        REPO: schubydoo/scratchsmith
        # Authenticates the releases API call to dodge the 60/hr anonymous limit on
        # shared runner IPs. Not sent to the asset-download URLs (the CDN redirect
        # rejects a GitHub auth header).
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Runner arch → release tarball arch token.
        case "$(uname -m)" in
          x86_64) arch=linux-amd64 ;;
          aarch64|arm64) arch=linux-arm64 ;;
          *) echo "::error::unsupported runner arch $(uname -m); scratchsmith ships linux amd64/arm64"; exit 1 ;;
        esac
        # Version precedence: explicit input → the calling ref (ONLY for the default,
        # empty input) → latest. An explicit `latest` resolves the newest release; it
        # must NOT silently fall back to the pinned ref.
        ver="${INPUT_VERSION:-}"
        if [ -z "$ver" ]; then
          case "$ACTION_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ver="$ACTION_REF" ;;
          esac
        fi
        if [ -z "$ver" ] || [ "$ver" = "latest" ]; then
          # Authenticate the API call to avoid the 60/hr anonymous rate limit on
          # shared runner IPs (a token raises it to 1000+/hr).
          auth=()
          [ -n "${GH_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GH_TOKEN}")
          ver="$(curl -fsSL "${auth[@]}" "https://api.github.com/repos/${REPO}/releases/latest" | jq -r .tag_name)"
        fi
        [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "::error::could not resolve a scratchsmith release version"; exit 1; }
        ver="${ver#v}" # normalise to the bare X.Y.Z used inside the tarball name
        tarball="scratchsmith-v${ver}-${arch}.tar.gz"
        base="https://github.com/${REPO}/releases/download/v${ver}"
        tmp="$(mktemp -d)"
        echo "Downloading ${tarball} (scratchsmith v${ver})"
        curl -fsSL -o "${tmp}/${tarball}" "${base}/${tarball}"
        curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
        curl -fsSL -o "${tmp}/checksums.txt.sigstore.json" "${base}/checksums.txt.sigstore.json"
        # Authenticity FIRST: verify the cosign keyless signature over checksums.txt
        # (bound to the release workflow's identity). THEN integrity: the tarball hash
        # against the now-trusted manifest. A signature alone doesn't tie to this
        # tarball; a checksum alone trusts an unverified manifest — both is the guarantee.
        ( cd "$tmp" && cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/knope-release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com )
        ( cd "$tmp" && sha256sum --ignore-missing --strict -c checksums.txt )
        tar -xzf "${tmp}/${tarball}" -C "$tmp"
        # Install to a fixed runner path the pack step reads directly. Avoids writing
        # to GITHUB_PATH (zizmor github-env) and needs no cross-step env sharing.
        dest="${RUNNER_TEMP}/scratchsmith-bin"
        mkdir -p "$dest"
        install -m 0755 "$tmp/scratchsmith-v${ver}-${arch}/scratchsmith" "$dest/scratchsmith"
    - name: Pack
      id: pack
      shell: bash
      env:
        IN_BINARY: ${{ inputs.binary }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_USER: ${{ inputs.user }}
        IN_STRIP: ${{ inputs.strip }}
        IN_SMOKE: ${{ inputs.smoke }}
        IN_SBOM: ${{ inputs.sbom }}
        IN_SBOM_FORMAT: ${{ inputs.sbom-format }}
        IN_CA_CERTS: ${{ inputs.ca-certs }}
        IN_TZ: ${{ inputs.tz }}
        IN_INIT: ${{ inputs.init }}
        IN_INCLUDE: ${{ inputs.include }}
        IN_ARGS: ${{ inputs.args }}
        IN_ENTRYPOINT: ${{ inputs.entrypoint }}
        IN_CMD: ${{ inputs.cmd }}
        IN_ENV: ${{ inputs.env }}
        IN_WORKDIR: ${{ inputs.workdir }}
        IN_LABEL: ${{ inputs.label }}
        IN_HEALTHCHECK: ${{ inputs.healthcheck }}
        IN_UPX: ${{ inputs.upx }}
        IN_SBOM_FILE: ${{ inputs.sbom-file }}
        IN_SCAN: ${{ inputs.scan }}
        IN_SCAN_FAIL_ON: ${{ inputs.scan-fail-on }}
        IN_MAX_SIZE: ${{ inputs.max-size }}
      run: |
        set -euo pipefail
        [ -n "$IN_BINARY" ] || { echo "::error::input 'binary' is required"; exit 1; }
        # Preflight: fail loud with a hint rather than a confusing pack error.
        if [ "$IN_SBOM" = "true" ] && ! command -v syft >/dev/null 2>&1; then
          echo "::error::sbom: true needs syft on the runner — add a step that installs it (e.g. anchore/sbom-action's installer) before this action."
          exit 1
        fi
        if { [ "$IN_SCAN" = "true" ] || [ -n "$IN_SCAN_FAIL_ON" ]; } && ! command -v grype >/dev/null 2>&1; then
          echo "::error::scan needs grype on the runner — add a step that installs it (e.g. anchore/scan-action's installer) before this action."
          exit 1
        fi
        if [ "$IN_UPX" = "true" ] && ! command -v upx >/dev/null 2>&1; then
          echo "::error::upx: true needs upx on the runner — add a step that installs it (e.g. apt-get install -y upx-ucl) before this action."
          exit 1
        fi
        args=("pack" "$IN_BINARY" "--format" "json")
        [ -n "$IN_OUTPUT" ] && args+=("--no-build" "--output" "$IN_OUTPUT")
        [ -n "$IN_USER" ] && args+=("--user" "$IN_USER")
        [ "$IN_STRIP" = "true" ] && args+=("--strip")
        [ "$IN_SMOKE" = "true" ] && args+=("--smoke")
        [ "$IN_CA_CERTS" = "true" ] && args+=("--ca-certs")
        [ "$IN_TZ" = "true" ] && args+=("--tz")
        [ "$IN_INIT" = "true" ] && args+=("--init")
        [ "$IN_UPX" = "true" ] && args+=("--upx")
        [ -n "$IN_ENTRYPOINT" ] && args+=("--entrypoint" "$IN_ENTRYPOINT")
        [ -n "$IN_WORKDIR" ] && args+=("--workdir" "$IN_WORKDIR")
        [ -n "$IN_MAX_SIZE" ] && args+=("--max-size" "$IN_MAX_SIZE")
        [ "$IN_SCAN" = "true" ] && args+=("--scan")
        [ -n "$IN_SCAN_FAIL_ON" ] && args+=("--scan-fail-on" "$IN_SCAN_FAIL_ON")
        if [ "$IN_SBOM" = "true" ]; then
          args+=("--sbom" "--sbom-format" "$IN_SBOM_FORMAT")
          [ -n "$IN_SBOM_FILE" ] && args+=("--sbom-file" "$IN_SBOM_FILE")
        fi
        # One flag per non-empty line for the list-valued inputs.
        while IFS= read -r lib; do
          [ -n "$lib" ] && args+=("--include" "$lib")
        done <<< "$IN_INCLUDE"
        while IFS= read -r c; do
          [ -n "$c" ] && args+=("--cmd" "$c")
        done <<< "$IN_CMD"
        while IFS= read -r e; do
          [ -n "$e" ] && args+=("--env" "$e")
        done <<< "$IN_ENV"
        while IFS= read -r lbl; do
          [ -n "$lbl" ] && args+=("--label" "$lbl")
        done <<< "$IN_LABEL"
        while IFS= read -r hc; do
          [ -n "$hc" ] && args+=("--healthcheck" "$hc")
        done <<< "$IN_HEALTHCHECK"
        # Verbatim escape-hatch flags (word-split intentionally).
        # shellcheck disable=SC2206
        [ -n "$IN_ARGS" ] && args+=($IN_ARGS)
        # Write the report to RUNNER_TEMP, not the caller's workspace (a composite
        # step runs in GITHUB_WORKSPACE, where a stray report.json would clobber a
        # real file or get swept into a later `git add .` / artifact glob).
        report_file="${RUNNER_TEMP}/scratchsmith-report.json"
        "${RUNNER_TEMP}/scratchsmith-bin/scratchsmith" "${args[@]}" | tee "$report_file"
        report="$(cat "$report_file")"
        image="$(jq -r '.tag // empty' "$report_file")"
        rootfs="$(jq -r '.staged_dir // empty' "$report_file")"
        {
          echo "image=$image"
          echo "rootfs=$rootfs"
          echo "report<<SSEOF"
          echo "$report"
          echo "SSEOF"
        } >> "$GITHUB_OUTPUT"
    - name: Push the built image
      if: ${{ inputs.push != '' }}
      shell: bash
      env:
        IN_PUSH: ${{ inputs.push }}
        IMAGE: ${{ steps.pack.outputs.image }}
      run: |
        set -euo pipefail
        [ -n "$IMAGE" ] || { echo "::error::push was requested but no image was built (did you set 'output'?)"; exit 1; }
        docker tag "$IMAGE" "$IN_PUSH"
        docker push "$IN_PUSH"
