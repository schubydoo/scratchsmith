[package]
name = "scratchsmith-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# resolve_graph and unpack_structured build structured inputs from arbitrary bytes.
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"
anyhow = "1"
# unpack_structured assembles a real OCI-layout archive (tar + gzip + sha256 + JSON) so
# the fuzzer reaches the layer/whiteout/path-safety code, not just the outer parse.
tar = "0.4"
flate2 = "1"
sha2 = "0.11" # match the main crate; a separate 0.10 tree just adds dep noise
serde_json = "1"

[dependencies.scratchsmith]
path = ".."

# Detach from any parent workspace (scratchsmith's root is a single crate, not a workspace).
[workspace]

[[bin]]
name = "parse_elf_info"
path = "fuzz_targets/parse_elf_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analyze_hardening"
path = "fuzz_targets/analyze_hardening.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_graph"
path = "fuzz_targets/resolve_graph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpack"
path = "fuzz_targets/unpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpack_structured"
path = "fuzz_targets/unpack_structured.rs"
test = false
doc = false
bench = false
